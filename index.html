<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f5f5f1">
  <meta name="description" content="在同一趟旅行里排行程、收藏想吃的店，随手记账和结算。">
  <title>去旅行吧</title>
  <style>
:root {
  color-scheme: light;
  --paper: #f5f5f1;
  --surface: #fffefa;
  --ink: #28352e;
  --muted: #627066;
  --line: #e1e5dc;
  --accent: #35664f;
  --accent-soft: #e9f0e6;
  --primary-hover: #264e3b;
  --neutral-soft: #f1f4ed;
  --sage: #eef2e9;
  --cocoa: #8a592d;
  --cocoa-soft: #fff1e1;
  --danger: #a33d35;
  --soft-danger: #fff1ec;
  --focus: #54836b;
  --shadow-panel: 0 4px 18px #3b493208;
  --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Heiti SC", "Microsoft YaHei", SimHei, "Noto Sans CJK SC", sans-serif;
  --gutter: clamp(16px, 4vw, 32px);
  --radius-small: 12px;
  --radius-panel: 20px;
  --radius-hero: 20px;
  --max-width: 1040px;
  --touch: 44px;
  --topbar-height: calc(68px + env(safe-area-inset-top, 0px));
  --travel-nav-height: 66px;
  --travel-nav-bottom: calc(9px + env(safe-area-inset-bottom));
  --travel-nav-space: calc(var(--travel-nav-height) + var(--travel-nav-bottom));
}

*, *::before, *::after {
  box-sizing: border-box;
}

html {
  min-width: 280px;
  background: var(--paper);
  scroll-padding-top: calc(var(--topbar-height) + 8px);
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  color: var(--ink);
  font-family: var(--font-sans);
  font-synthesis: none;
  font-size: 15px;
  line-height: 1.6;
}

body:has(dialog[open]) {
  overflow: hidden;
}

button, select, input, textarea {
  color: inherit;
  font: inherit;
}

button, a, select, input, textarea, summary {
  touch-action: manipulation;
}

button {
  cursor: pointer;
}

button:disabled, button[aria-disabled="true"] {
  cursor: default;
}

a {
  color: var(--accent);
}

img, svg {
  display: block;
  max-width: 100%;
}

h1, h2, h3, p, ul, ol, dl, dd {
  margin: 0;
}

h1, h2, h3 {
  line-height: 1.3;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 3px;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}

.page {
  width: min(var(--max-width), calc(100% - var(--gutter) * 2));
  margin-inline: auto;
  padding-bottom: 48px;
}

.topbar {
  position: sticky;
  z-index: 4;
  top: 0;
  display: flex;
  min-height: var(--topbar-height);
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 12px;
  margin-inline: calc(-1 * var(--gutter));
  padding-block: calc(8px + env(safe-area-inset-top, 0px)) 8px;
  padding-inline: max(var(--gutter), env(safe-area-inset-left, 0px)) max(var(--gutter), env(safe-area-inset-right, 0px));
  border-bottom: 1px solid var(--line);
  background: var(--surface);
}

#content {
  padding-top: 16px;
}

.brand {
  display: inline-flex;
  min-width: 0;
  min-height: var(--touch);
  flex: 0 0 auto;
  align-items: center;
  gap: 8px;
  color: var(--ink);
  font-size: 19px;
  font-weight: 650;
  line-height: 1.25;
  text-decoration: none;
}

.brand-mark {
  display: grid;
  width: 34px;
  height: 34px;
  flex: 0 0 auto;
  place-items: center;
  border-radius: 11px;
  background: var(--accent);
  color: var(--surface);
  font-size: 19px;
  font-weight: 550;
}

.top-actions, .hero-actions, .sheet-actions, .row-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.top-actions {
  flex: 0 1 auto;
  justify-content: flex-end;
  margin-inline-start: auto;
  white-space: nowrap;
}

.button {
  display: inline-flex;
  min-width: var(--touch);
  min-height: var(--touch);
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border: 1px solid transparent;
  border-radius: 14px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 14px;
  font-weight: 650;
  line-height: 1.28;
  text-align: center;
  text-decoration: none;
  transition: background-color 160ms ease-out, border-color 160ms ease-out, color 160ms ease-out, transform 160ms ease-out;
}

.button.update-entry {
  position: relative;
  padding-inline: 7px;
  background: transparent;
  font-size: 13px;
  letter-spacing: normal;
  white-space: nowrap;
}

.update-indicator {
  position: absolute;
  inset-block-start: 7px;
  inset-inline-end: 5px;
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--cocoa);
  pointer-events: none;
}

.button.primary {
  background: var(--accent);
  color: var(--surface);
  box-shadow: 0 3px 8px #31523a10;
}

.button.tonal {
  border-color: #d6dfd1;
  background: #f6f8f2;
  color: var(--accent);
}

.button.quiet, .button.icon-button {
  background: transparent;
  color: var(--accent);
}

.button.icon-button {
  flex: 0 0 var(--touch);
  padding: 8px;
}

.button.danger {
  background: var(--soft-danger);
  color: var(--danger);
}

.button:disabled, .button[aria-disabled="true"] {
  opacity: .48;
}

.button:active:not(:disabled):not([aria-disabled="true"]),
.category-filter:active, .trip-choice:active,
.travel-nav button:active {
  transform: scale(.975);
}

.button svg, .category-icon svg, .overview-icon svg {
  width: 19px;
  height: 19px;
  flex: 0 0 auto;
}

@media (hover: hover) {
  .button:hover:not(:disabled):not([aria-disabled="true"]) {
    border-color: #d3ddca;
    background: var(--accent-soft);
  }

  .button.primary:hover:not(:disabled):not([aria-disabled="true"]) {
    border-color: var(--primary-hover);
    background: var(--primary-hover);
  }

  .button.danger:hover:not(:disabled):not([aria-disabled="true"]) {
    border-color: #f6d1d7;
    background: #ffe9ee;
  }
}

.hero {
  position: relative;
  isolation: isolate;
  overflow: hidden;
  border: 1px solid var(--line);
  border-radius: var(--radius-hero);
  background: var(--surface);
  color: var(--ink);
  box-shadow: var(--shadow-panel);
}

.hero-inner {
  position: relative;
  z-index: 1;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  min-height: 148px;
  padding: 24px clamp(23px, 4vw, 36px) 20px;
}

.trip-cover-image {
  position: absolute;
  z-index: -2;
  inset: 0;
  width: 100%;
  height: 100%;
  max-width: none;
  object-fit: cover;
  object-position: 50% 47%;
  pointer-events: none;
}

.travel-hero:has(> .trip-cover-image) {
  --cover-height: clamp(214px, 29vw, 322px);
  --cover-block-padding: clamp(21px, 4vw, 40px);
  --cover-inline-padding: var(--cover-block-padding);
  background: var(--sage);
}

.travel-hero:has(> .trip-cover-image)::before {
  position: absolute;
  z-index: -1;
  inset: 0;
  background:
    linear-gradient(90deg, rgb(238 242 233 / .98), rgb(238 242 233 / .73) 48%, transparent),
    linear-gradient(0deg, rgb(238 242 233 / .94), rgb(238 242 233 / .54) 40%, transparent 90%);
  content: "";
  pointer-events: none;
}

.travel-hero:has(> .trip-cover-image) > .hero-inner {
  min-height: var(--cover-height);
  align-items: flex-end;
  justify-content: space-between;
  padding: var(--cover-block-padding) var(--cover-inline-padding);
}

.travel-hero:has(> .trip-date-range) {
  display: grid;
  min-height: var(--cover-height, 0);
  grid-template-rows: minmax(0, 1fr) auto;
}

.travel-hero:has(> .trip-date-range) > .hero-inner {
  min-height: 0;
  padding-block-end: 8px;
}

.trip-date-range {
  position: relative;
  justify-self: end;
  margin: 0 var(--cover-inline-padding, 18px) var(--cover-block-padding, 18px);
  padding: 4px 10px;
  border: 1px solid #e8ddd1;
  border-radius: 999px;
  background: #fcf7ed;
  color: var(--cocoa);
  font-size: 13px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  line-height: 1.35;
  text-align: end;
  overflow-wrap: anywhere;
}

.travel-hero.hero-empty:has(> .trip-cover-image) .hero-inner {
  align-items: flex-start;
  justify-content: flex-end;
}

.travel-hero.hero-empty .hero-actions {
  align-self: flex-start;
}

.travel-hero:has(> .trip-cover-image) .hero-art {
  display: none;
}

.hero-context {
  display: flex;
  flex-shrink: 0;
  min-width: 0;
  flex-wrap: wrap;
  align-items: center;
  justify-content: flex-end;
  gap: 7px;
}

.travel-hero:is([data-view="itinerary"], [data-view="restaurants"]) {
  --cover-action-inset: 14px;
}

.travel-hero:is([data-view="itinerary"], [data-view="restaurants"]) > .hero-inner {
  flex-direction: column;
  align-items: flex-start;
  justify-content: flex-end;
  padding-block-start: calc(var(--cover-action-inset) + var(--touch) + 8px);
}

.hero-context:has(> .hero-settings-button) {
  position: absolute;
  inset-block-start: var(--cover-action-inset);
  inset-inline-end: var(--cover-action-inset);
}

.hero-context > .hero-settings-button {
  background: var(--surface);
  white-space: nowrap;
}

.travel-hero[data-view="ledger"] {
  --ledger-hero-inset: clamp(12px, 2.2vw, 20px);
  --ledger-hero-gap: clamp(8px, 1.6vw, 14px);
}

.travel-hero[data-view="ledger"] > .hero-inner {
  min-height: 0;
  flex-wrap: wrap;
  gap: 8px 12px;
  padding: var(--ledger-hero-inset) var(--ledger-hero-inset) 10px;
}

.travel-hero[data-view="ledger"] .hero-context {
  flex: 0 1 auto;
  margin-inline-start: auto;
}

.ledger-hero-actions {
  gap: 6px;
}

.ledger-hero-actions > .button {
  padding-inline: 10px;
  font-size: 13px;
  white-space: nowrap;
}

.travel-hero[data-view="ledger"] > .trip-overview {
  gap: var(--ledger-hero-gap);
  margin: 0 var(--ledger-hero-inset) var(--ledger-hero-inset);
}

.travel-hero[data-view="ledger"] .overview-card {
  min-height: 0;
  padding: clamp(10px, 1.6vw, 14px);
}

.hero-kicker {
  margin-bottom: 7px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 620;
  line-height: 1.35;
}

.hero-copy {
  min-width: 0;
}

.hero-empty .hero-inner {
  align-items: flex-start;
  justify-content: center;
  flex-direction: column;
  gap: 19px;
  min-height: 214px;
  padding-block: 29px;
}

.hero-empty .hero-meta {
  max-width: 33em;
}

.hero h1 {
  max-width: 22ch;
  font-size: clamp(28px, 3.9vw, 38px);
  font-weight: 650;
  line-height: 1.13;
  letter-spacing: -.05em;
  overflow-wrap: anywhere;
}

.hero-meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 12px;
  margin-top: 8px;
  color: var(--muted);
  font-size: 14px;
  font-weight: 500;
  overflow-wrap: anywhere;
}

.hero-art {
  position: absolute;
  z-index: 0;
  inset: 0 0 auto auto;
  width: min(65%, 640px);
  height: 100%;
  pointer-events: none;
}

.hero-art::before {
  position: absolute;
  border: 1px solid #a3b29555;
  border-radius: 50%;
  content: "";
  width: 230px;
  height: 108px;
  right: 54px;
  top: 12px;
  rotate: -16deg;
  border-style: dashed;
  border-left-color: transparent;
  border-top-color: transparent;
}

.hero-plane {
  position: absolute;
  z-index: 1;
  top: 16px;
  right: 14%;
  display: block;
  color: #b0bcab;
  font-family: "Segoe UI Symbol", system-ui, sans-serif;
  font-size: clamp(34px, 5vw, 61px);
  font-variant-emoji: text;
  line-height: 1;
  transform: rotate(-24deg);
}

.hero-actions {
  align-self: flex-end;
  flex-shrink: 0;
}

.category-filter {
  display: inline-flex;
  flex: 0 0 auto;
  min-width: var(--touch);
  min-height: var(--touch);
  max-width: 100%;
  align-items: center;
  justify-content: center;
  gap: 5px;
  padding: 6px 13px;
  border: 1px solid transparent;
  border-radius: 999px;
  line-height: 1.3;
  overflow-wrap: anywhere;
  font-size: 14px;
  font-weight: 650;
  text-align: center;
  transition: background-color 160ms ease-out, border-color 160ms ease-out, transform 160ms ease-out;
}

.trip-overview {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 14px;
  margin-top: 16px;
}

.overview-card {
  display: grid;
  min-width: 0;
  min-height: 102px;
  grid-template-columns: 36px minmax(0, 1fr);
  align-items: start;
  gap: 12px;
  padding: 16px;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}

.overview-card.tone-total {
  --tile: var(--accent-soft);
  --tile-ink: var(--accent);
  border-color: #dce4d5;
  background: var(--sage);
  box-shadow: none;
}

.overview-icon, .category-icon {
  display: grid;
  flex-shrink: 0;
  place-items: center;
  line-height: 1;
  background: var(--tile, var(--neutral-soft));
  color: var(--tile-ink, var(--muted));
  font-variant-emoji: text;
}

.overview-icon {
  width: 36px;
  height: 36px;
  border-radius: 10px;
  font-size: 17px;
}

.overview-copy {
  display: grid;
  min-width: 0;
  gap: 3px;
  overflow-wrap: anywhere;
}

.overview-label, .overview-detail {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.4;
}

.overview-label {
  font-weight: 650;
}

.overview-value {
  color: var(--ink);
  font-size: clamp(20px, 2.6vw, 29px);
  font-weight: 660;
  line-height: 1.13;
  letter-spacing: -.045em;
  font-variant-numeric: tabular-nums;
}

.overview-value.hero-number {
  color: var(--accent);
}

.workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(230px, .41fr);
  align-items: start;
  gap: 20px;
  margin-top: 18px;
}

.ledger-summary {
  display: grid;
  min-width: 0;
  grid-template-columns: minmax(0, 1fr);
  gap: 14px;
}

.travel-panel {
  min-width: 0;
  margin-top: 16px;
  padding: clamp(16px, 3.2vw, 28px);
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}

.section-heading, .food-card-head {
  display: flex;
  min-width: 0;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 8px 14px;
}

.section-heading {
  margin-bottom: 16px;
}

.section-heading h2 {
  color: var(--ink);
  font-size: clamp(18px, 2.7vw, 22px);
  font-weight: 650;
  overflow-wrap: anywhere;
}

.section-heading p {
  margin-top: 3px;
  color: var(--muted);
  font-size: 14px;
}

.stats-list {
  padding: 0;
  list-style: none;
}

.stats-list > li {
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(0, auto);
  gap: 7px 10px;
  align-items: center;
  padding-block: 12px;
  overflow-wrap: anywhere;
}

.stats-list > li + li {
  border-top: 1px solid var(--line);
}

.stats-amount {
  min-width: 0;
  color: var(--accent);
  font-size: 15px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
  text-align: end;
}

.stats-bar {
  display: block;
  width: 100%;
  height: 6px;
  grid-column: 1 / -1;
  appearance: none;
  overflow: hidden;
  border: 0;
  border-radius: 999px;
  background: var(--neutral-soft);
  color: #90aa7c;
}

.stats-bar::-webkit-meter-bar {
  height: 6px;
  border: 0;
  background: var(--neutral-soft);
}

.stats-bar::-webkit-meter-optimum-value {
  border-radius: 999px;
  background: #90aa7c;
}

.stats-bar::-moz-meter-bar {
  border-radius: 999px;
  background: #90aa7c;
}

.settings-page.travel-panel {
  max-width: 660px;
  margin: 0 auto;
  padding: 4px 0 0;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.settings-groups {
  display: grid;
  gap: 14px;
}

.settings-group {
  min-width: 0;
  padding: 14px 16px 4px;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  overflow-wrap: anywhere;
}

.settings-heading {
  padding-bottom: 8px;
}

.settings-heading h3 {
  font-size: 17px;
}

.settings-heading p, .settings-row-copy p, .settings-status p,
.settings-detail > p, .settings-help dd {
  color: var(--muted);
  font-size: 13px;
}

.settings-rows {
  padding: 0;
  list-style: none;
}

.settings-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 12px;
  padding-block: 10px;
  border-top: 1px solid var(--line);
}

.settings-row-copy {
  flex: 1 1 112px;
  min-width: 0;
}

.settings-row-actions {
  margin-inline-start: auto;
}

.settings-row-actions .button {
  padding-inline: 10px;
  white-space: nowrap;
}

.settings-status {
  margin-bottom: 10px;
  padding: 10px 12px;
  border-radius: var(--radius-small);
  background: var(--neutral-soft);
}

.settings-status[data-state="ready"] {
  background: var(--accent-soft);
  color: var(--accent);
}

.settings-detail {
  border-bottom: 0;
}

.settings-detail summary, .settings-help dt {
  font-weight: 650;
}

.settings-detail > :not(summary) {
  padding-bottom: 10px;
}

.settings-help {
  display: grid;
  gap: 8px;
}

.item-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 8px;
}

.item-actions .quiet {
  padding-inline: 9px;
}

.plan-day {
  min-width: 0;
  border: 0;
}

.plan-day + .plan-day {
  margin-top: 21px;
}

.plan-day-heading {
  display: grid;
  width: 100%;
  min-height: var(--touch);
  grid-template-columns: minmax(0, 1fr) max-content 16px;
  align-items: center;
  gap: 8px;
  padding: 8px 12px;
  border-radius: var(--radius-small);
  background: var(--neutral-soft);
  color: var(--muted);
  font-size: 13px;
  list-style: none;
  transition: background-color 160ms ease-out;
}

.plan-day-heading::-webkit-details-marker {
  display: none;
}

.plan-day-date {
  color: var(--ink);
  font-size: 16px;
  font-weight: 650;
  overflow-wrap: anywhere;
}

.plan-day-count {
  font-size: 12px;
  white-space: nowrap;
}

.plan-day-chevron {
  width: 8px;
  height: 8px;
  justify-self: center;
  transform: rotate(-45deg);
  border-inline-end: 1.5px solid currentColor;
  border-block-end: 1.5px solid currentColor;
  color: var(--accent);
  transition: transform 160ms ease-out;
}

.plan-day[open] .plan-day-chevron {
  transform: rotate(45deg);
}

@media (hover: hover) {
  .plan-day-heading:hover {
    background: var(--accent-soft);
  }
}

.plan-list, .food-list {
  padding: 0;
  list-style: none;
}

.plan-item {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr) auto;
  align-items: start;
  gap: 6px 13px;
  min-height: 70px;
  padding: 12px 2px;
}

.plan-item + .plan-item,
.plan-list > li + li {
  border-top: 1px solid var(--line);
}

.plan-time {
  min-width: 49px;
  padding-top: 2px;
  color: var(--cocoa);
  font-size: 13px;
  font-weight: 650;
  font-variant-numeric: tabular-nums;
}

.plan-item-main, .plan-item-heading {
  min-width: 0;
  overflow-wrap: anywhere;
}

.plan-item-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: 4px 8px;
}

.plan-item-heading h3, .plan-item-heading h4, .food-card h3, .food-card h4 {
  margin: 0;
  color: var(--ink);
  font-size: 17px;
  font-weight: 650;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

.plan-kind, .food-status {
  display: inline-flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
  padding: 3px 8px;
  border-radius: 999px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 12px;
  font-weight: 650;
  line-height: 1.35;
}

.travel-meta {
  margin-top: 3px;
  color: var(--muted);
  font-size: 13px;
  line-height: 1.5;
  overflow-wrap: anywhere;
}

.plan-notes, .food-copy {
  margin-top: 6px;
  color: var(--muted);
  font-size: 14px;
  line-height: 1.5;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.food-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  margin-bottom: 14px;
}

.food-filters .button {
  border-radius: 999px;
}

.food-filters .button[aria-pressed="true"] {
  border-color: #d7e3d0;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 740;
}

.food-list {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 10px;
}

.food-card {
  display: grid;
  min-width: 0;
  align-content: start;
  gap: 4px;
  padding: 14px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: #fafbf7;
  overflow-wrap: anywhere;
}

.food-card .item-actions {
  margin-top: 3px;
  padding-top: 4px;
}

.food-status[data-status="want"] {
  background: var(--cocoa-soft);
  color: var(--cocoa);
}

.food-status[data-status="visited"] {
  background: var(--neutral-soft);
  color: var(--muted);
}

.travel-panel > .empty {
  min-height: 116px;
  padding-inline: 0;
}

.existing-plan-link {
  margin-top: 12px;
}

.food-delete-confirm {
  padding: 10px 12px;
  border: 1px solid #f3cbd3;
  border-radius: var(--radius-small);
  background: var(--soft-danger);
  color: var(--danger);
}

.food-delete-confirm .row-actions {
  margin-top: 6px;
}

.starter {
  display: flex;
  min-height: 112px;
  align-items: center;
  justify-content: space-between;
  gap: 12px 20px;
  margin-top: 18px;
  padding: 17px 21px;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}

.starter h2 {
  margin-bottom: 3px;
  font-size: 19px;
}

.starter p {
  color: var(--muted);
  font-size: 14px;
}

.starter .button {
  flex: 0 0 auto;
}

.ledger-panel, .side-panel, .stats-panel {
  min-width: 0;
  border: 1px solid var(--line);
  border-radius: var(--radius-panel);
  background: var(--surface);
  box-shadow: var(--shadow-panel);
}

.ledger-panel {
  overflow: hidden;
}

.ledger-heading {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px 16px;
  padding: 18px 20px 15px;
}

.ledger-heading h2, .sheet h2 {
  font-size: 20px;
  font-weight: 650;
}

.ledger-heading p, .side-panel p, .sheet-head p {
  color: var(--muted);
  font-size: 14px;
}

.ledger-title-group {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px 10px;
}

.ledger-title-group .count {
  padding: 3px 9px;
  border-radius: 999px;
  background: var(--neutral-soft);
}

.filters, .category-filters {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
  min-width: 0;
}

.filters {
  padding: 0 20px 12px;
}

.category-filter {
  padding-inline: 12px;
  background: var(--neutral-soft);
  color: var(--muted);
}

.ledger-heading .filters {
  flex: 1 0 100%;
  padding: 1px 0 0;
}

.category-filter > span {
  flex: 0 0 auto;
}

.category-filter[aria-pressed="true"] {
  border-color: #d7e3d0;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 750;
}

@media (hover: hover) {
  .category-filter:not([aria-pressed="true"]):hover {
    border-color: var(--line);
    background: var(--neutral-soft);
  }
}

.field {
  display: grid;
  align-content: start;
  gap: 5px;
  min-width: 0;
}

.sheet label.field {
  display: block;
  font-size: 14px;
  font-weight: 680;
}

.sheet label.field > :is(input, select, textarea) {
  margin-top: 5px;
}

.sheet label.field > .hint {
  display: block;
  margin-top: 5px;
  font-weight: 450;
}

.field .optional {
  margin-left: 3px;
  color: var(--muted);
  font-weight: 450;
}

.field > label,
.field > span:first-child,
.field-label,
fieldset > legend {
  color: var(--ink);
  font-size: 14px;
  font-weight: 680;
}

input:not([type="checkbox"]):not([type="radio"]):not([type="hidden"]),
select,
textarea {
  display: block;
  width: 100%;
  min-width: 0;
  min-height: var(--touch);
  padding: 9px 11px;
  border: 1px solid #dce3d5;
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.35;
}

input::placeholder, textarea::placeholder {
  color: var(--muted);
}

input[type="checkbox"], input[type="radio"] {
  width: 18px;
  height: 18px;
  flex: 0 0 18px;
  margin: 0;
  accent-color: var(--accent);
}

input[type="file"] {
  color: var(--muted);
}

textarea {
  min-height: 76px;
  resize: vertical;
}

input:disabled, select:disabled, textarea:disabled {
  background: var(--neutral-soft);
  color: var(--muted);
}

input[aria-invalid="true"], select[aria-invalid="true"], textarea[aria-invalid="true"] {
  border-color: var(--danger);
}

.day-group {
  min-width: 0;
  padding: 0 20px 7px;
}

.day-group + .day-group {
  padding-top: 5px;
}

.day-heading {
  display: flex;
  min-height: 37px;
  align-items: center;
  justify-content: space-between;
  gap: 6px 12px;
  padding: 7px 10px;
  border-radius: 9px;
  background: var(--neutral-soft);
  color: var(--muted);
  font-size: 13px;
  font-weight: 680;
}

.day-heading h3 {
  color: var(--muted);
  font-size: 14px;
}

.expense-list, .member-list, .settlement-list {
  padding: 0;
  list-style: none;
}

.expense-row {
  display: flex;
  width: 100%;
  min-width: 0;
  min-height: 66px;
  align-items: center;
  gap: 11px;
  padding: 8px 4px;
  border: 0;
  background: transparent;
  color: var(--ink);
  text-align: start;
  transition: background-color 160ms ease-out;
}

.expense-row + .expense-row,
.expense-list > li + li {
  border-top: 1px solid var(--line);
}

.expense-list > li > .expense-row {
  border: 0;
}

button.expense-row {
  border-radius: var(--radius-small);
}

@media (hover: hover) {
  button.expense-row:hover, .expense-row:has(button:hover) {
    background: var(--neutral-soft);
  }
}

button.expense-row:active {
  background: var(--accent-soft);
}

.category-icon {
  width: 36px;
  height: 36px;
  flex: 0 0 36px;
  border-radius: 10px;
  font-size: 16px;
  font-weight: 650;
}

.expense-copy {
  display: grid;
  min-width: 0;
  flex: 1 1 auto;
  gap: 2px;
  overflow-wrap: anywhere;
}

.expense-copy strong, .member-row strong, .transfer-row strong {
  font-size: 15px;
  font-weight: 720;
  line-height: 1.35;
}

.expense-copy small, .expense-amount small, .member-row small, .transfer-row small {
  display: block;
  color: var(--muted);
  font-size: 13px;
  font-weight: 450;
  line-height: 1.4;
}

.expense-amount {
  flex: 0 0 auto;
  color: var(--ink);
  font-size: 17px;
  font-weight: 790;
  text-align: end;
  white-space: nowrap;
  font-variant-numeric: tabular-nums;
}

.side-panel, .stats-panel {
  padding: 18px 16px 16px;
}

.side-panel h2, .stats-panel h2 {
  margin-bottom: 4px;
  font-size: 18px;
  font-weight: 650;
}

.side-heading {
  display: flex;
  min-height: var(--touch);
  align-items: center;
  justify-content: space-between;
  gap: 4px;
}

.side-heading h2 {
  margin: 0;
}

.side-heading .compact {
  flex: 0 0 auto;
  padding-inline: 7px;
  font-size: 13px;
}

.side-panel > .button {
  width: 100%;
  margin-top: 12px;
}

.member-list {
  margin-top: 5px;
}

.member-row,
.transfer-row {
  display: flex;
  min-height: 46px;
  align-items: center;
  justify-content: space-between;
  gap: 8px 12px;
  padding: 8px 0;
  color: var(--ink);
  overflow-wrap: anywhere;
  font-variant-numeric: tabular-nums;
}

.member-row {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) minmax(0, auto);
  align-items: start;
  gap: 8px;
}

.member-initial, .empty-mark {
  display: grid;
  width: 32px;
  height: 32px;
  place-items: center;
  border-radius: 50%;
  background: var(--neutral-soft);
  color: var(--muted);
  font-size: 14px;
  font-weight: 700;
}

.member-row .member-balance {
  max-width: 126px;
  color: var(--muted);
  font-size: 13px;
  font-weight: 600;
}

.member-row .member-balance.receivable {
  color: var(--accent);
}

.side-panel .itinerary-link {
  margin-top: 13px;
}

.member-row + .member-row,
.transfer-row + .transfer-row {
  border-top: 1px solid var(--line);
}

.member-row > *, .transfer-row > * {
  min-width: 0;
}

.member-row > .member-balance, .transfer-row > :last-child {
  text-align: end;
}

.empty {
  display: grid;
  min-height: 150px;
  align-content: center;
  justify-items: start;
  gap: 6px;
  padding: 23px 20px;
  color: var(--muted);
  overflow-wrap: anywhere;
}

.empty h3, .empty strong {
  color: var(--ink);
}

.empty-mark {
  width: 38px;
  height: 38px;
  margin-bottom: 4px;
  border-radius: 10px;
  font-size: 17px;
}

.empty > .button {
  margin-top: 6px;
}

.status, .storage-error, .sheet-notice {
  padding: 10px 14px;
  border: 1px solid #d7e3d0;
  border-radius: var(--radius-small);
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 14px;
  overflow-wrap: anywhere;
}

.status {
  position: fixed;
  z-index: 3;
  right: var(--gutter);
  bottom: max(24px, env(safe-area-inset-bottom));
  width: fit-content;
  max-width: min(420px, calc(100% - var(--gutter) * 2));
  box-shadow: 0 6px 18px #344e3217;
}

.status:not([hidden]) {
  animation: backdrop-enter 160ms ease-out both;
}

.status:empty {
  display: none;
}

.status[data-type="error"], .status.error, .form-error, .storage-error {
  border-color: #f3cbd3;
  background: var(--soft-danger);
  color: var(--danger);
}

.storage-error {
  margin-bottom: 12px;
}

.sheet-notice {
  margin: 0 20px 12px;
}

.page-footer {
  margin-top: 20px;
  color: var(--muted);
  font-size: 13px;
  text-align: center;
}

.sheet {
  --sheet-travel: 10px;
  width: min(560px, calc(100% - 24px));
  max-width: none;
  max-height: calc(100dvh - 32px);
  margin: auto;
  padding: 0;
  overflow: auto;
  overscroll-behavior: contain;
  border: 1px solid var(--line);
  border-radius: var(--radius-hero);
  background: var(--surface);
  color: var(--ink);
  box-shadow: 0 18px 46px #29362736;
}

.sheet[open] {
  animation: sheet-enter 240ms cubic-bezier(.18, .73, .28, 1) both;
}

.sheet::backdrop {
  background: #25342373;
}

.sheet[open]::backdrop {
  animation: backdrop-enter 180ms ease-out both;
}

@keyframes sheet-enter {
  from {
    opacity: 0;
    transform: translateY(var(--sheet-travel));
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes backdrop-enter {
  from { opacity: 0; }
  to { opacity: 1; }
}

.sheet-head {
  position: sticky;
  z-index: 1;
  top: 0;
  display: flex;
  min-height: 68px;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
  border-bottom: 1px solid var(--line);
  background: var(--surface);
  overflow-wrap: anywhere;
}

.sheet-body {
  display: grid;
  gap: 14px;
  padding: 18px 20px;
}

.sheet-body h3 {
  font-size: 16px;
}

.update-release {
  display: grid;
  gap: 8px;
  overflow-wrap: anywhere;
}

.update-release p {
  color: var(--muted);
}

.update-notes {
  display: grid;
  gap: 6px;
  padding-inline-start: 20px;
}

.update-notes li::marker {
  color: var(--accent);
}

.sheet .button.icon-button {
  font-size: 25px;
  font-weight: 450;
}

.settlement-sheet {
  width: min(620px, calc(100% - 24px));
}

.ai-page.ai-sheet {
  --ai-inset: 14px;
  --ai-panel-radius: 20px;
  --ai-chat-paper: #f1f4ed;
  --ai-strip: #f6f8f2;
  container: ai-dialog / size;
  display: flex;
  width: min(760px, 100%);
  height: clamp(300px, calc(100dvh - var(--topbar-height) - 24px - var(--travel-nav-space)), 860px);
  max-height: none;
  flex-direction: column;
  margin: 0 auto;
  overflow: visible;
  border: 0;
  background: transparent;
  box-shadow: none;
}

.ai-titlebar {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
}

.ai-title-copy {
  min-width: 0;
}

.ai-title-copy h2 {
  font-size: clamp(21px, 3.5vw, 25px);
  line-height: 1.25;
}

.ai-title-copy p {
  overflow: hidden;
  color: var(--muted);
  font-size: 12px;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.ai-title-actions {
  display: flex;
  flex: 0 0 auto;
  align-items: center;
  gap: 4px;
}

.ai-title-actions .button {
  padding-inline: 8px;
  font-size: 12px;
  white-space: nowrap;
}

.ai-connection, .ai-options, .ai-history-note, .ai-messages, .ai-composer {
  border-inline: 1px solid var(--line);
}

.ai-connection, .ai-options {
  display: block;
  flex: 0 1 auto;
  min-height: calc(var(--touch) + 1px);
  max-height: min(250px, 38%);
  padding: 0 var(--ai-inset);
  overflow-y: auto;
  overscroll-behavior: contain;
  border-top: 0;
  border-bottom: 1px solid var(--line);
  background: var(--ai-strip);
}

.ai-connection {
  min-height: calc(var(--touch) + 2px);
  border-top: 1px solid var(--line);
  border-radius: var(--ai-panel-radius) var(--ai-panel-radius) 0 0;
  background: var(--surface);
}

.ai-connection > summary, .ai-options > summary {
  position: sticky;
  z-index: 1;
  top: 0;
  align-content: center;
  padding-block: 8px;
  background: inherit;
  font-size: 13px;
  line-height: 1.4;
  overflow-wrap: anywhere;
}

.ai-connection[open] > :not(summary), .ai-options[open] > :not(summary) {
  margin-bottom: 12px;
}

.ai-options p {
  color: var(--muted);
  font-size: 13px;
}

.ai-mode {
  max-width: 230px;
  margin-block: 8px;
}

.ai-auto-record {
  display: flex;
  min-height: var(--touch);
  align-items: center;
  gap: 8px;
  color: var(--accent);
  font-size: 13px;
}

:is(.ai-payload-details, details.ai-payload-preview) {
  margin-top: 8px;
}

:is(.ai-payload-details, details.ai-payload-preview) textarea {
  min-height: 84px;
  background: var(--surface);
}

:is(.ai-payload-details, details.ai-payload-preview)[open] > .hint {
  padding-block: 5px 8px;
}

.ai-history-note {
  flex: 0 0 auto;
  margin: 0;
  padding: 5px var(--ai-inset);
  border-bottom: 1px solid var(--line);
  background: var(--ai-strip);
  color: var(--muted);
  font-size: 11px;
  overflow-wrap: anywhere;
}

.ai-setup.form-grid {
  grid-template-columns: minmax(0, 1fr);
  gap: 10px;
}

.ai-setup-actions {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.ai-setup-choice {
  display: flex;
  min-height: var(--touch);
  align-items: flex-start;
  gap: 8px;
  padding-block: 8px;
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.ai-setup-choice input {
  margin-top: 2px;
}

.ai-setup-link {
  font-size: 13px;
}

.ai-history-list {
  display: grid;
  gap: 8px;
}

.ai-history-item {
  min-width: 0;
  overflow-wrap: anywhere;
}

button.ai-history-item {
  display: grid;
  width: 100%;
  grid-template-columns: minmax(0, 1fr) auto;
  text-align: start;
}

.ai-history-item > .hint {
  white-space: nowrap;
}

.ai-messages {
  display: flex;
  flex: 1 1 0;
  min-height: 0;
  flex-direction: column;
  gap: 12px;
  padding: 16px var(--ai-inset) 18px;
  overflow-y: auto;
  overscroll-behavior: contain;
  overflow-anchor: none;
  background: var(--ai-chat-paper);
}

.ai-page:has(.ai-composer[hidden]) .ai-messages {
  border-bottom: 1px solid var(--line);
  border-radius: 0 0 var(--ai-panel-radius) var(--ai-panel-radius);
}

.ai-empty {
  width: min(100%, 340px);
  margin: clamp(10px, 4vw, 42px) auto 0;
  padding-bottom: 8px;
  text-align: center;
  overflow-wrap: anywhere;
}

.ai-empty-art {
  display: block;
  width: 72px;
  height: 72px;
  margin: 0 auto 8px;
  object-fit: contain;
}

.ai-empty h3 {
  margin-bottom: 8px;
  font-size: 17px;
}

.ai-empty p {
  color: var(--muted);
  font-size: 13px;
  line-height: 1.65;
}

.ai-examples {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 8px;
  margin-top: 16px;
}

.ai-examples .button {
  padding-inline: 10px;
  font-size: 12px;
}

.ai-message {
  align-self: flex-start;
  max-width: min(92%, 48ch);
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  border-start-start-radius: 5px;
  background: var(--surface);
  font-size: 14px;
  line-height: 1.7;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
}

.ai-message-user {
  align-self: flex-end;
  border-color: #d8e3d0;
  border-start-start-radius: var(--radius-small);
  border-start-end-radius: 5px;
  background: #e1ecd8;
  color: #294431;
}

.ai-message:has(.ai-drafts, .ai-image-results) {
  width: min(92%, 410px);
}

.ai-auto-recorded {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 4px 8px;
  margin-block: 8px;
  padding: 3px 6px 3px 10px;
  border-radius: 10px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 13px;
}

.ai-auto-recorded .button {
  padding-inline: 8px;
}

.ai-image-results {
  display: grid;
  gap: 6px;
  margin-block: 8px;
  padding: 0;
  list-style: none;
}

.ai-image-result {
  display: grid;
  gap: 2px;
  padding-top: 6px;
  border-top: 1px solid var(--line);
  color: var(--accent);
  font-size: 12px;
  white-space: normal;
}

.ai-image-result:is([data-state="needs_review"], [data-state="unreadable"]) {
  color: var(--cocoa);
}

.ai-image-result .hint {
  font-size: inherit;
}

.ai-drafts {
  display: grid;
  gap: 8px;
  padding: 0;
  list-style: none;
}

.ai-draft-group {
  display: grid;
  gap: 6px;
}

.ai-draft-day {
  padding: 2px 0;
  color: var(--accent);
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.ai-draft-source, .ai-image-segments {
  font-size: 12px;
}

.ai-image-segments {
  white-space: nowrap;
}

.ai-draft {
  display: grid;
  justify-items: start;
  gap: 6px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--surface);
  overflow-wrap: anywhere;
}

.ai-composer {
  display: grid;
  flex: 0 1 auto;
  min-height: calc(var(--touch) + 17px);
  gap: 5px;
  margin: 0;
  padding: 8px 10px;
  overflow-y: auto;
  overscroll-behavior: contain;
  border-block: 1px solid var(--line);
  border-radius: 0 0 var(--ai-panel-radius) var(--ai-panel-radius);
  background: #fafbf7;
}

.ai-attachments {
  display: flex;
  max-height: min(90px, 17dvh);
  flex-wrap: wrap;
  gap: 6px;
  overflow-y: auto;
}

.ai-attachments:empty, .ai-status:empty, .ai-dictation:empty {
  display: none;
}

.ai-attachment {
  display: inline-flex;
  min-width: 0;
  max-width: 100%;
  align-items: center;
  gap: 6px;
  padding: 0 6px 0 10px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--neutral-soft);
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.ai-attachment img {
  width: 40px;
  height: 40px;
  flex: 0 0 auto;
  border-radius: 6px;
  object-fit: cover;
}

.ai-composer-tools {
  position: sticky;
  z-index: 1;
  bottom: 0;
  display: flex;
  min-width: 0;
  align-items: flex-end;
  gap: 6px;
  background: inherit;
}

.ai-input-label {
  position: relative;
  min-width: 0;
  flex: 1 1 0;
}

.ai-composer-tools .ai-input-label textarea {
  height: var(--touch);
  min-height: var(--touch);
  max-height: 84px;
  margin: 0;
  padding: 8px 9px;
  overflow-y: auto;
  resize: none;
  font-size: 16px;
}

.ai-input-label textarea::placeholder {
  font-size: 13px;
}

.ai-composer-tools > .button {
  flex: 0 0 auto;
  padding-inline: 8px;
  white-space: nowrap;
}

.ai-composer-tools :is(#ai-speech, #ai-add-image) {
  width: var(--touch);
  height: var(--touch);
  padding: 4px;
}

#ai-speech {
  background: var(--accent-soft);
}

#ai-speech[aria-pressed="true"] {
  background: var(--accent);
  color: var(--surface);
}

#ai-add-image {
  border-color: transparent;
  background: transparent;
  font-size: 24px;
  font-weight: 500;
  line-height: 1;
}

.ai-mic-mark {
  position: relative;
  display: block;
  width: 15px;
  height: 18px;
  background:
    linear-gradient(currentColor, currentColor) center bottom / 8px 1.5px no-repeat,
    linear-gradient(currentColor, currentColor) center bottom / 1.5px 5px no-repeat;
}

.ai-mic-mark::before, .ai-mic-mark::after {
  position: absolute;
  border: 1.5px solid currentColor;
  content: "";
}

.ai-mic-mark::before {
  inset: 0 4px auto;
  height: 11px;
  border-radius: 6px;
}

.ai-mic-mark::after {
  inset: 5px 0 4px;
  border-top: 0;
  border-radius: 0 0 8px 8px;
}

.ai-composer-tools :is(#ai-send, #ai-cancel-send) {
  min-width: 52px;
  font-size: 13px;
}

.ai-composer-tools:has(#ai-cancel-send:not([hidden])) #ai-send:disabled {
  display: none;
}

.ai-status, .ai-dictation {
  color: var(--muted);
  font-size: 12px;
  overflow-wrap: anywhere;
}

.ai-status[data-type="error"] {
  color: var(--danger);
}

@container ai-dialog (max-height: 440px) {
  .ai-titlebar {
    margin-bottom: 4px;
  }

  .ai-title-copy h2 {
    font-size: 19px;
  }

  .ai-messages {
    padding-block: 8px;
  }

  .ai-connection, .ai-options {
    max-height: min(180px, 38%);
  }

  .ai-empty {
    margin-top: 6px;
  }

  .ai-empty-art {
    width: 48px;
    height: 48px;
    margin-bottom: 6px;
  }

  .ai-empty h3 {
    margin-bottom: 4px;
    font-size: 15px;
  }

  .ai-examples {
    gap: 5px;
    margin-top: 8px;
  }

  .ai-attachments {
    max-height: 48px;
  }
}

#ai-view[data-ai-keyboard] > .ai-page.ai-sheet {
  position: fixed;
  z-index: 5;
  inset: var(--ai-keyboard-top, 0px) 0 auto;
  width: min(760px, 100%);
  height: var(--ai-keyboard-height, 100dvh);
  min-height: 0;
  max-height: none;
  flex: none;
  padding-top: max(0px, calc(env(safe-area-inset-top) - var(--ai-keyboard-top, 0px)));
  padding-inline: env(safe-area-inset-left) env(safe-area-inset-right);
  overflow: hidden;
  border-radius: 0;
  background: var(--paper);
}

#ai-view[data-ai-keyboard] ~ .travel-nav,
#ai-view[data-ai-keyboard] :is(.ai-connection, .ai-options, .ai-history-note, .ai-title-copy p) {
  display: none;
}

#ai-view[data-ai-keyboard] .ai-titlebar {
  margin-bottom: 0;
  padding-inline: var(--ai-inset);
  border-bottom: 1px solid var(--line);
}

#ai-view[data-ai-keyboard] .ai-title-copy h2 {
  font-size: 17px;
}

#ai-view[data-ai-keyboard] .ai-messages {
  padding-block: 8px;
}

#ai-view[data-ai-keyboard] .ai-composer {
  max-height: min(60%, 158px);
  border-radius: 0;
}

#ai-view[data-ai-keyboard] .ai-attachments {
  max-height: 48px;
}

.quick-entry {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: end;
  gap: 6px 8px;
  padding: 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--neutral-soft);
}

.quick-entry > .hint {
  grid-column: 1 / -1;
}

.split-tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 2px 6px;
}

.split-tools .compact {
  padding-inline: 8px;
  font-size: 13px;
}

.split-tools .hint {
  margin-left: auto;
}

details {
  border-block: 1px solid var(--line);
}

summary {
  min-height: var(--touch);
  padding-block: 10px;
  color: var(--accent);
  cursor: pointer;
}

.details-fields {
  padding: 6px 0 12px;
}

.details-fields > :last-child {
  grid-column: 1 / -1;
}

.field-set {
  display: grid;
  gap: 4px;
}

.existing-members {
  padding-bottom: 12px;
  border-bottom: 1px solid var(--line);
}

#trip-existing-members:empty {
  display: none;
}

.sheet-actions {
  position: sticky;
  z-index: 1;
  bottom: 0;
  justify-content: flex-end;
  padding: 12px 20px;
  border-top: 1px solid var(--line);
  background: var(--surface);
}

.sheet-actions > .danger:first-child {
  margin-right: auto;
}

.form-grid {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 14px 12px;
}

.form-grid > .full, .form-grid > .full-width, .form-grid > fieldset {
  grid-column: 1 / -1;
}

.trip-date-fields {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  align-items: start;
  gap: 12px;
}

fieldset {
  min-width: 0;
  margin: 0;
  padding: 0;
  border: 0;
}

fieldset > legend {
  margin-bottom: 6px;
  padding: 0;
}

.pills {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 6px;
}

.pill {
  display: inline-flex;
  min-height: var(--touch);
  max-width: 100%;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 6px 11px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  line-height: 1.35;
  overflow-wrap: anywhere;
}

label.pill {
  cursor: pointer;
}

.pill[aria-pressed="true"], .pill.is-selected, .pill:has(input:checked) {
  border-color: #b7caad;
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 680;
}

.hint {
  color: var(--muted);
  font-size: 13px;
  overflow-wrap: anywhere;
}

.form-error:not(:empty) {
  padding: 8px 10px;
  border: 1px solid #f3cbd3;
  border-radius: var(--radius-small);
  font-size: 14px;
  overflow-wrap: anywhere;
}

.form-error:empty {
  display: none;
}

.table-wrap {
  max-width: 100%;
  overflow-x: auto;
}

.table-wrap table {
  width: 100%;
  min-width: 340px;
  border-collapse: collapse;
  text-align: start;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.table-wrap th, .table-wrap td {
  padding: 8px 9px;
  border-bottom: 1px solid var(--line);
  text-align: end;
  vertical-align: top;
}

.table-wrap th {
  background: var(--neutral-soft);
  color: var(--ink);
  font-weight: 700;
}

.table-wrap th:first-child, .table-wrap td:first-child {
  text-align: start;
  overflow-wrap: anywhere;
}

.settlement-intro {
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--neutral-soft);
  color: var(--ink);
  font-size: 14px;
  overflow-wrap: anywhere;
}

.settlement-intro h3 {
  margin-bottom: 2px;
}

.settlement-clear {
  padding: 9px 12px;
  border-block: 1px solid var(--line);
  color: var(--muted);
  font-size: 14px;
}

.transfer-names {
  text-align: start;
  overflow-wrap: anywhere;
}

.settlement-balance {
  font-variant-numeric: tabular-nums;
}

.trip-choice {
  display: flex;
  width: 100%;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  min-height: 49px;
  padding: 10px 12px;
  border: 1px solid var(--line);
  border-radius: var(--radius-small);
  background: var(--surface);
  text-align: start;
  overflow-wrap: anywhere;
  transition: background-color 160ms ease-out, transform 160ms ease-out;
}

.trip-choice > :first-child {
  min-width: 0;
}

.trip-choice > span {
  flex: 0 1 auto;
  color: var(--muted);
  font-size: 13px;
  text-align: end;
}

@media (hover: hover) {
  .trip-choice:hover {
    background: var(--neutral-soft);
  }
}

.count {
  color: var(--muted);
  font-size: 13px;
  font-variant-numeric: tabular-nums;
}

.copy-fallback textarea, textarea.copy-fallback {
  min-height: 140px;
}

.travel-nav {
  position: fixed;
  z-index: 3;
  inset: auto max(12px, env(safe-area-inset-right)) var(--travel-nav-bottom) max(12px, env(safe-area-inset-left));
  display: grid;
  max-width: 420px;
  min-height: var(--travel-nav-height);
  grid-template-columns: repeat(5, minmax(0, 1fr));
  gap: 4px;
  margin: 0 auto;
  padding: 5px;
  border: 1px solid var(--line);
  border-radius: 28px;
  background: var(--surface);
  box-shadow: 0 8px 24px #30422d14;
}

.page:has(.travel-nav) {
  padding-bottom: calc(var(--travel-nav-space) + 26px);
}

html:has(.travel-nav) {
  scroll-padding-bottom: calc(var(--travel-nav-space) + 16px);
}

body:has(.travel-nav) .status {
  bottom: calc(var(--travel-nav-space) + 13px);
}

.travel-nav button {
  display: inline-flex;
  min-width: 0;
  min-height: 54px;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  padding: 4px 2px;
  border: 0;
  border-radius: 23px;
  background: transparent;
  color: #5b6b53;
  font-size: 11px;
  font-weight: 550;
  line-height: 1.28;
  white-space: nowrap;
  transition: background-color 160ms ease-out, transform 160ms ease-out;
}

.travel-nav-icon {
  width: 22px;
  height: 22px;
  flex: 0 0 auto;
  stroke-width: 1.7;
}

.travel-nav button[aria-current="page"] {
  background: #e0ead6;
  color: #2b553b;
  font-weight: 650;
}

@media (hover: hover) {
  .travel-nav button:not([aria-current="page"]):hover {
    background: var(--neutral-soft);
  }
}

@media (max-width: 760px) {
  .workspace {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
    margin-top: 16px;
  }

  .hero-inner {
    min-height: 147px;
    gap: 17px;
  }

  .trip-overview {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .food-list {
    grid-template-columns: minmax(0, 1fr);
  }

  .page:has(#content > #ai-view:not([hidden])) {
    display: flex;
    min-height: var(--ai-viewport-height, 100dvh);
    flex-direction: column;
    padding-bottom: calc(var(--travel-nav-space) + 8px);
  }

  #content:has(> #ai-view:not([hidden])), #ai-view {
    display: flex;
    min-height: 0;
    flex: 1 1 auto;
    flex-direction: column;
  }

  .page:has(#content > #ai-view:not([hidden])) .page-footer {
    margin-top: 8px;
  }

  .ai-page.ai-sheet {
    --ai-inset: 12px;
    height: auto;
    min-height: 318px;
    max-height: none;
    flex: 1 1 auto;
  }
}

@media (max-width: 560px) {
  html {
    --topbar-height: calc(65px + env(safe-area-inset-top, 0px));
  }

  .page {
    padding-bottom: 20px;
  }

  #content {
    padding-top: 12px;
  }

  .topbar {
    column-gap: 8px;
  }

  .brand {
    gap: 6px;
    font-size: 17px;
  }

  .brand-mark {
    width: 29px;
    height: 29px;
    border-radius: 9px;
    font-size: 16px;
  }

  .top-actions {
    gap: 4px;
  }

  .top-actions .button {
    padding-inline: 9px;
  }

  .hero-inner {
    min-height: 0;
    padding: 18px 18px 13px;
  }

  .hero-empty .hero-inner {
    min-height: 219px;
    padding-block: 23px;
  }

  .hero h1 {
    font-size: clamp(26px, 7vw, 36px);
  }

  .hero h1, .hero-meta {
    max-width: calc(100vw - 112px);
  }

  .travel-hero:has(> .trip-cover-image) {
    --cover-height: clamp(195px, 58vw, 278px);
    --cover-block-padding: 21px;
    --cover-inline-padding: 18px;
  }

  .travel-hero:has(> .trip-cover-image) h1,
  .travel-hero:has(> .trip-cover-image) .hero-meta {
    max-width: 100%;
  }

  .hero-context > .button {
    padding-inline: 10px;
  }

  .travel-hero[data-view="ledger"] h1,
  .travel-hero[data-view="ledger"] .hero-meta {
    max-width: 100%;
  }

  .hero-art {
    width: 64%;
  }

  .hero-art::before {
    width: 145px;
    height: 83px;
    right: 13px;
    top: -14px;
  }

  .hero-plane {
    top: 10px;
    right: 9%;
    font-size: 42px;
  }

  .category-filter {
    padding-inline: 10px;
    font-size: 13px;
  }

  .trip-overview {
    margin-top: 12px;
  }

  .overview-card {
    min-height: 93px;
    grid-template-columns: 34px minmax(0, 1fr);
    gap: 8px;
    padding: 11px;
  }

  .overview-icon {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    font-size: 17px;
  }

  .overview-value {
    font-size: clamp(18px, 5.4vw, 25px);
  }

  .starter {
    flex-wrap: wrap;
    align-items: flex-start;
    padding: 14px;
  }

  .section-heading {
    align-items: flex-start;
    margin-bottom: 12px;
  }

  .plan-item {
    grid-template-columns: 47px minmax(0, 1fr);
    gap: 4px 10px;
  }

  .plan-item > .item-actions {
    grid-column: 2;
  }

  .ledger-heading, .day-group {
    padding-inline: 14px;
  }

  .filters {
    padding-inline: 14px;
  }

  .side-panel, .stats-panel {
    padding-inline: 14px;
  }

  .sheet {
    --sheet-travel: 17px;
    inset: auto 0 0;
    width: 100%;
    max-width: 100%;
    max-height: calc(100dvh - 12px);
    margin: 0;
    border: 0;
    border-radius: 18px 18px 0 0;
  }

  .sheet-head, .sheet-body, .sheet-actions {
    padding-inline: 16px;
  }

  .sheet-notice {
    margin-inline: 16px;
  }

  .sheet-actions {
    padding-bottom: max(12px, env(safe-area-inset-bottom));
  }
}

@media (max-width: 374px) {
  .trip-date-fields {
    grid-template-columns: minmax(0, 1fr);
  }
}

@media (max-width: 360px) {
  .brand {
    gap: 5px;
    font-size: 16px;
  }

  .top-actions .button {
    padding-inline: 5px;
    font-size: 13px;
  }

  .overview-card {
    grid-template-columns: 25px minmax(0, 1fr);
    align-items: center;
    gap: 4px 7px;
  }

  .overview-icon {
    width: 25px;
    height: 25px;
    border-radius: 7px;
    font-size: 14px;
  }

  .overview-copy {
    display: contents;
  }

  .overview-value, .overview-detail {
    grid-column: 1 / -1;
    overflow-wrap: anywhere;
  }

  .form-grid {
    grid-template-columns: minmax(0, 1fr);
  }

  .travel-nav {
    gap: 3px;
  }
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }

  .sheet[open]::backdrop {
    animation: none;
  }

  .button:active, .category-filter:active, .trip-choice:active,
  .travel-nav button:active {
    transform: none !important;
  }
}

[data-tone="food"] {
  --category-ink: #914539;
  --category-tint: #f8e9e2;
  --category-wash: #fff8f3;
  --category-stroke: #b97260;
}

[data-tone="lodging"] {
  --category-ink: #365d82;
  --category-tint: #e2edf6;
  --category-wash: #f5f9fd;
  --category-stroke: #7397b9;
}

[data-tone="transport"] {
  --category-ink: #32624e;
  --category-tint: #e3efe7;
  --category-wash: #f4faf5;
  --category-stroke: #76a18a;
}

[data-tone="tickets"] {
  --category-ink: #694f87;
  --category-tint: #eee8f7;
  --category-wash: #faf7fd;
  --category-stroke: #9b87b5;
}

[data-tone="shopping"] {
  --category-ink: #765314;
  --category-tint: #f9efd8;
  --category-wash: #fffbf0;
  --category-stroke: #bc974d;
}

[data-tone="daily"] {
  --category-ink: #346567;
  --category-tint: #e1efed;
  --category-wash: #f4faf9;
  --category-stroke: #76a9a8;
}

[data-tone="other"] {
  --category-ink: #535c55;
  --category-tint: #eeeee8;
  --category-wash: #f8f8f4;
  --category-stroke: #979f93;
}

.category-icon,
.overview-icon,
.category-chip[data-tone] {
  background: var(--category-tint, var(--neutral-soft));
  color: var(--category-ink, var(--muted));
}

.category-chip {
  display: inline-flex;
  max-width: 100%;
  align-items: center;
  gap: 5px;
  padding: 4px 9px;
  border-radius: 999px;
  line-height: 1.25;
  font-weight: 650;
}

.category-chip svg,
.category-filter svg {
  width: 15px;
  height: 15px;
  flex: 0 0 auto;
}

.overview-card[data-tone] {
  display: block;
  min-height: 116px;
  border-color: color-mix(in srgb, var(--category-stroke), var(--surface) 74%);
  background: var(--category-wash);
  box-shadow: none;
}

.overview-copy {
  display: grid;
  grid-template-columns: max-content minmax(0, 1fr);
  align-items: center;
  gap: 5px 8px;
}

.overview-icon {
  width: 29px;
  height: 29px;
  border-radius: 9px;
}

.overview-icon svg {
  width: 17px;
  height: 17px;
}

.overview-label,
.overview-value,
.overview-value.hero-number {
  color: var(--category-ink);
}

.overview-value,
.overview-detail {
  grid-column: 1 / -1;
}

.overview-value {
  margin-top: 5px;
  word-break: normal;
}

.overview-value.overview-range {
  font-size: clamp(16px, 1.85vw, 23px);
  line-height: 1.2;
}

.category-filter[data-tone] {
  color: var(--category-ink);
}

.category-filter[data-tone][aria-pressed="true"] {
  border-color: var(--category-stroke);
  background: var(--category-tint);
  color: var(--category-ink);
}

.expense-amount,
.stats-amount {
  color: var(--category-ink, var(--ink));
}

.stats-category,
.food-card-head h3,
.settings-heading h3 {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 8px;
  overflow-wrap: anywhere;
}

.stats-category > .category-icon {
  width: 25px;
  height: 25px;
  flex-basis: 25px;
  border-radius: 7px;
}

.stats-category > .category-icon svg {
  width: 15px;
  height: 15px;
}

.stats-list [data-tone] .stats-bar::-webkit-meter-optimum-value {
  background: var(--category-stroke);
}

.stats-list [data-tone] .stats-bar::-moz-meter-bar {

  const domestic = new Set(["deepseek", "dashscope", "siliconflow", "moonshot", "zhipu"]);
  const safeErrors = {

  const visionErrors = {
    server: "接口未完成图片测试。请核对当前模型和接口是否支持图片输入。",

  };

  function settingsError(code) {
    const error = new Error(safeErrors[code]);
    error.code = code;
    return error;
  }

  function makeVisionSample() {
    const alphabet = "3479ACDEFHJKMNPQ";
    const canvas = document.createElement("canvas");
    canvas.width = 256;
    canvas.height = 88;
    const drawing = canvas.getContext("2d");
    if (!globalThis.crypto?.getRandomValues || !drawing) throw settingsError("vision-image");
    const random = crypto.getRandomValues(new Uint8Array(6));
    const expected = Array.from(random, (byte) => alphabet[byte % alphabet.length]).join("");
    drawing.fillStyle = "#fff";
    drawing.fillRect(0, 0, canvas.width, canvas.height);
    drawing.fillStyle = "#111";
    drawing.font = "bold 42px monospace";
    drawing.textAlign = "center";
    drawing.textBaseline = "middle";
    drawing.fillText(expected, canvas.width / 2, canvas.height / 2);
    const dataUrl = canvas.toDataURL("image/png");
    if (!dataUrl.startsWith("data:image/png;base64,")) throw settingsError("vision-image");
    return {dataUrl, expected};
  }

  function openVault() {
    if (!globalThis.indexedDB) throw settingsError("vault");
    return new Promise((resolve, reject) => {
      let settled = false;
      const request = indexedDB.open(databaseName, 1);
      const timer = setTimeout(fail, 5000);
      function fail() {
        if (settled) return;
        settled = true;
        clearTimeout(timer);
        reject(settingsError("vault"));
      }
      request.onupgradeneeded = () => request.result.createObjectStore(credentialStore);
      request.onerror = fail;
      request.onblocked = fail;
      request.onsuccess = () => {
        const db = request.result;
        if (settled) { db.close(); return; }
        settled = true;
        clearTimeout(timer);
        db.onversionchange = () => db.close();
        resolve(db);
      };
    });
  }

  async function vault(mode, operation) {
    const db = await openVault();
    try {
      return await new Promise((resolve, reject) => {
        const tx = db.transaction(credentialStore, mode);
        const request = operation(tx.objectStore(credentialStore));
        const timer = setTimeout(() => {
          try { tx.abort(); } catch { /* The transaction already ended. */ }
          fail();
        }, 5000);
        function fail() {
          clearTimeout(timer);
          reject(settingsError("vault"));
        }
        tx.onerror = fail;
        tx.onabort = fail;
        tx.oncomplete = () => {
          clearTimeout(timer);
          resolve(request.result);
        };
      });
    } catch {
      throw settingsError("vault");
    } finally {
      db.close();
    }
  }

  function vaultBinding(baseUrl, iv) {
    return {name: "AES-GCM", iv, additionalData: new TextEncoder().encode(`${databaseName}\n${baseUrl}`)};
  }

  async function rememberCredential(baseUrl, key) {
    if (!globalThis.isSecureContext || !globalThis.crypto?.subtle || !keyPattern.test(key)) throw settingsError("vault");
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const bytes = new TextEncoder().encode(key);
    try {
      const cryptoKey = await crypto.subtle.generateKey({name: "AES-GCM", length: 256}, false, ["encrypt", "decrypt"]);
      const ciphertext = await crypto.subtle.encrypt(vaultBinding(baseUrl, iv), cryptoKey, bytes);
      await vault("readwrite", (store) => store.put({baseUrl, cryptoKey, iv, ciphertext}, entry));
    } catch {
      throw settingsError("vault");
    } finally {
      bytes.fill(0);
    }
  }

  async function restoreCredential(baseUrl) {
    if (!globalThis.isSecureContext || !globalThis.crypto?.subtle) throw settingsError("vault");
    const data = await vault("readonly", (store) => store.get(entry));
    if (!data || data.baseUrl !== baseUrl) return "";
    if (!(data.iv instanceof Uint8Array) || data.iv.byteLength !== 12 || !(data.ciphertext instanceof ArrayBuffer)
      || data.ciphertext.byteLength < 24 || data.ciphertext.byteLength > 2064
      || data.cryptoKey?.extractable !== false || data.cryptoKey.algorithm?.name !== "AES-GCM"
      || data.cryptoKey.algorithm?.length !== 256) throw settingsError("vault");
    let bytes;
    try {
      bytes = new Uint8Array(await crypto.subtle.decrypt(vaultBinding(baseUrl, data.iv), data.cryptoKey, data.ciphertext));
      const key = new TextDecoder("utf-8", {fatal: true}).decode(bytes);
      if (!keyPattern.test(key)) throw settingsError("vault");
      return key;
    } catch {
      throw settingsError("vault");
    } finally {
      bytes?.fill(0);
    }
  }

  function forgetCredential() {
    return vault("readwrite", (store) => store.delete(entry));
  }

  function mount(host, {client, onApply, onInvalidate}) {
    if (!host) return {cancel() {}};
    host.innerHTML = `<form id="ai-settings" class="ai-setup form-grid">

      <div class="ai-setup-actions ai-setup-manage full"><button id="ai-forget-key" class="button quiet" type="button">忘记密钥</button><button id="ai-reset-config" class="button quiet" type="button">清除接口配置</button></div>
      <p class="hint full">接口需允许浏览器跨域访问。</p>

    const get = (id) => host.querySelector(`#${id}`);
    const form = get("ai-settings");
    const provider = get("ai-provider");
    const base = get("ai-base");
    const keyInput = get("ai-key");
    const modelInput = get("ai-model");
    const modelSelect = get("ai-model-select");
    const inputMode = get("ai-input-mode");
    const rememberConfig = get("ai-remember-config");
    const rememberKey = get("ai-remember-key");
    const testReply = get("ai-test-reply");
    let active;
    let revision = 0;
    let writing = false;
    let restoring = false;
    let storedCredential = false;
    let savedBase = "";
    let liveKey = "";

    for (const [label, isDomestic] of [["国内服务", true], ["国际服务", false]]) {
      const group = document.createElement("optgroup");
      group.label = label;
      for (const [id, name] of providers.filter(([id]) => domestic.has(id) === isDomestic)) {

      provider.append(group);
    }
    provider.append(new Option("自定义兼容接口", "custom"));

    function status(id, message = "", isError = false) {
      const element = get(id);
      element.textContent = message;
      element.hidden = !message;
      element.dataset.kind = isError ? "error" : "";
    }

    function explainProvider() {
      const selected = providers.find(([id]) => id === provider.value);
      const link = get("ai-provider-docs");
      status("ai-provider-note", selected?.[4]);
      link.hidden = !selected;
      if (selected) link.href = selected[3];
      else link.removeAttribute("href");
    }

    function renderModelList(models = []) {
      modelSelect.replaceChildren(new Option("选择一个模型", ""), ...models.map((id) => new Option(id, id)));
      if (models.includes(modelInput.value)) modelSelect.value = modelInput.value;
      get("ai-model-select-row").hidden = models.length === 0;
    }

    function sync() {
      for (const control of form.querySelectorAll("input, select")) control.disabled = writing;
      rememberKey.disabled = writing || !rememberConfig.checked;
      for (const id of ["ai-list-models", "ai-test-save", "ai-save-only", "ai-test-image"]) get(id).disabled = Boolean(active || writing || restoring);
      get("ai-cancel-detect").hidden = !active || active.type === "vision";
      get("ai-cancel-image-test").hidden = active?.type !== "vision";
      get("ai-forget-key").disabled = writing || !(storedCredential || liveKey || keyInput.value);
      get("ai-reset-config").disabled = writing || !(savedBase || base.value || modelInput.value || liveKey || storedCredential);
      status("ai-key-state", liveKey ? (storedCredential ? "已从这台设备准备好密钥。" : "本次页面的密钥已就绪。") : "接口需要密钥时，请在这里填写。");
      status("ai-detection-target", testReply.checked
        ? "检测将向所选接口发送一次简短的固定文字。"
        : "默认检测查询模型列表，不发送账单或图片。");
    }

    function stop(announce = false) {
      const operation = active;
      active = null;
      operation?.controller.abort();
      if (operation && announce) {
        if (operation.type === "vision") status("ai-vision-status", "已取消等待。已发出的图片测试仍可能被处理并计费。");
        else status(operation.type === "models" ? "ai-models-status" : "ai-settings-status", safeErrors.cancelled);
      }
      sync();
    }

    function edit({target = false, clearModels = false, invalidate = true} = {}) {
      revision++;
      restoring = false;
      stop();
      status("ai-vision-status");
      if (target) {
        keyInput.value = "";
        liveKey = "";
        rememberKey.checked = false;
      }
      if (clearModels) {
        renderModelList();
        status("ai-models-status");
      }
      testReply.checked = false;
      if (invalidate) onInvalidate();
      status("ai-settings-status", "设置已修改，保存后生效。");
      sync();
    }

    function messageFor(error, fallback) {
      return Object.hasOwn(safeErrors, error?.code) ? safeErrors[error.code] : fallback;
    }

    function candidate(requireModel = true) {
      const seed = {baseUrl: base.value, model: requireModel ? modelInput.value : "model-list"};
      const checked = client.configure(seed);
      const typed = keyInput.value.trim();
      const key = typed || (checked.baseUrl === savedBase ? liveKey : "");
      const config = client.configure({...seed, apiKey: key});
      const mode = inputMode.value === "text" ? "text" : "image";
      return {config, key, mode};
    }

    function begin(type) {
      active = {type, controller: new AbortController()};
      sync();
      return active;
    }

    function end(operation) {
      if (active === operation) active = null;
      sync();
    }

    async function discover() {
      if (active || writing || restoring) return;
      let operation;
      try {
        const {config, key} = candidate(false);
        operation = begin("models");
        status("ai-models-status", "正在获取模型列表…");
        const ids = await client.models({baseUrl: config.baseUrl, apiKey: key}, operation.controller.signal);
        if (active !== operation) return;
        const models = [...new Set(ids.filter((id) => typeof id === "string" && modelId.test(id) && (!key || !id.includes(key))))].slice(0, 1000);
        renderModelList(models);
        status("ai-models-status", models.length
          ? `返回 ${models.length} 个模型，可从结果选择或手动填写。`
          : "服务没有返回可选模型，可以手动填写模型名。");
      } catch (error) {
        if (!operation || active === operation) {
          status("ai-models-status", messageFor(error, "未能获取模型，请检查地址和密钥。"), true);
        }
      } finally {
        end(operation);
      }
    }

    async function testImage() {
      if (active || writing || restoring) return;
      let operation;
      try {
        const {config} = candidate();
        const target = new URL(config.endpoint).hostname;
        if (!confirm(`向 ${target} 发送一张临时测试图来验证图片识别能力。测试可能产生费用。继续吗？`)) return;
        const sample = makeVisionSample();
        operation = begin("vision");
        status("ai-vision-status", "正在测试模型能否读图…");
        await client.probeImage(config, sample, operation.controller.signal);
        if (active === operation) status("ai-vision-status", "图片识别测试通过。当前模型读出了测试图上的代码。");
      } catch (error) {
        if (!operation || active === operation) {
          const message = Object.hasOwn(visionErrors, error?.code) ? visionErrors[error.code]
            : messageFor(error, "图片测试未完成。请检查模型和接口的图片支持后重试。");
          status("ai-vision-status", message, true);
        }
      } finally {
        end(operation);
      }
    }

    async function persist(config, key, mode, keepConfig, keepKey) {
      if (keepKey && !key) throw settingsError("key");
      const next = keepConfig ? JSON.stringify({baseUrl: config.baseUrl, model: config.model, mode, rememberKey: keepKey}) : null;
      let previous;
      try {
        previous = localStorage.getItem(settingsKey);
        if (next !== null) localStorage.setItem(settingsKey, next);
        else if (previous !== null) localStorage.removeItem(settingsKey);
      } catch {
        throw settingsError("storage");
      }
      try {
        if (keepKey) await rememberCredential(config.baseUrl, key);
        else if (storedCredential) await forgetCredential();
        storedCredential = keepKey;
      } catch {
        try {
          if (localStorage.getItem(settingsKey) === next) {
            if (previous === null) localStorage.removeItem(settingsKey);
            else localStorage.setItem(settingsKey, previous);
          }
        } catch { /* Keep the key out of plaintext even if preference storage fails. */ }
        throw settingsError("vault");
      }
    }

    async function save(detect) {
      if (active || writing || restoring) return;
      let operation;
      let ownsWrite = false;
      try {
        const {config, key, mode} = candidate();
        const remember = rememberConfig.checked;
        const rememberSecret = remember && rememberKey.checked;
        const reply = detect && testReply.checked;
        if (rememberSecret && !key) throw settingsError("key");
        if (detect) {
          operation = begin("probe");
          status("ai-settings-status", reply ? "正在测试一次 AI 回复…" : "正在检查接口和所选模型…");
          await client.probe(config, {reply}, operation.controller.signal);
          if (active !== operation) return;
        }
        active = null;
        writing = true;
        ownsWrite = true;
        sync();
        await persist(config, key, mode, remember, rememberSecret);
        savedBase = config.baseUrl;
        liveKey = key;
        keyInput.value = "";
        testReply.checked = false;
        const message = reply ? "文字回复测试通过。识图能力可单独测试。"
          : detect ? "接口和模型列表检查通过。" : "已保存本次填写的设置。";
        status("ai-settings-status", message);
        onApply(config, {mode, feedback: message});
      } catch (error) {
        if (!operation || active === operation || ownsWrite) {
          status("ai-settings-status", messageFor(error, "未能应用设置，请核对后再试。"), true);
        }
      } finally {
        if (ownsWrite) writing = false;
        end(operation);
      }
    }

    async function clear(reset) {
      if (writing) return;
      edit({target: true, clearModels: true});
      writing = true;
      sync();
      try {
        if (storedCredential) await forgetCredential();
        storedCredential = false;
        const previous = JSON.parse(localStorage.getItem(settingsKey) || "null");
        if (reset) localStorage.removeItem(settingsKey);
        else if (previous?.baseUrl && previous?.model) {
          localStorage.setItem(settingsKey, JSON.stringify({
            baseUrl: previous.baseUrl, model: previous.model,
            mode: previous.mode === "text" ? "text" : "image", rememberKey: false
          }));
        }
        if (reset) {
          form.reset();
          provider.value = "";
          savedBase = "";
          explainProvider();
        }
        status("ai-settings-status", reset ? "已清除这台设备上的接口设置。" : "已清除密钥。需要时可重新填写。");
      } catch (error) {
        status("ai-settings-status", messageFor(error, "暂时无法清除本机设置，请重试。"), true);
      } finally {
        writing = false;
        sync();
      }
    }

    async function restore() {
      let saved;
      try { saved = JSON.parse(localStorage.getItem(settingsKey) || "null"); }
      catch { return; }
      if (!saved) return;
      let config;
      try { config = client.configure({baseUrl: saved.baseUrl, model: saved.model}); }
      catch { return; }
      const mode = saved.mode === "text" ? "text" : "image";
      base.value = config.baseUrl;
      modelInput.value = config.model;
      inputMode.value = mode;
      provider.value = providers.find(([, , url]) => url === config.baseUrl)?.[0] ?? "custom";
      savedBase = config.baseUrl;
      storedCredential = saved.rememberKey === true;
      rememberKey.checked = storedCredential;
      explainProvider();
      if (!storedCredential) {
        onApply(config, {mode, restored: true});
        status("ai-settings-status", "地址和模型已从本机恢复。");
        sync();
        return;
      }
      const run = revision;
      restoring = true;
      sync();
      status("ai-settings-status", "正在恢复本机密钥…");
      try {
        const restored = await restoreCredential(config.baseUrl);
