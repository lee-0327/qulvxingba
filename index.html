  let transcriptionModel = (preference(transcriptionKey) || "").slice(0, 150);

  if (autoRecord) {
    try { autoRecord.checked = localStorage.getItem(autoRecordKey) !== "off"; }
    catch { /* The current choice remains available when local storage is blocked. */ }
    autoRecord.addEventListener("change", () => {
      try { localStorage.setItem(autoRecordKey, autoRecord.checked ? "on" : "off"); }
      catch { /* The current choice applies until this page closes. */ }
    });
  }

  function status(id, message = "", {error = false} = {}) {
    const node = get(id);
    node.textContent = message;
    node.hidden = !message;
    if (error) node.dataset.type = "error";
    else delete node.dataset.type;
  }

  function addText(parent, className, value, tag = "p") {
    const node = document.createElement(tag);
    if (className) node.className = className;
    node.textContent = value;
    parent.append(node);
    return node;
  }

  function image(parent, source, label) {
    const node = document.createElement("img");
    node.src = source;
    node.alt = label;
    parent.append(node);
  }

  function summarize(action) {
    if (action.kind === "restaurant") return [action.city, action.address, action.dishes].filter(Boolean).join(" · ");
    if (action.kind === "itinerary") return [action.date, action.time, action.place].filter(Boolean).join(" · ");
    return [action.amountCents != null ? `¥${(action.amountCents / 100).toFixed(2)}` : "金额待核对", action.date, action.category].filter(Boolean).join(" · ");
  }

  function headingForDay(date) {
    if (!date) return "日期待补充";
    const { startDate, endDate } = active.trip || {};
    if (!startDate || !endDate || date < startDate || date > endDate) return date;
    const elapsed = Date.parse(date) - Date.parse(startDate);
    return Number.isFinite(elapsed) ? `${date} · 第 ${elapsed / 86400000 + 1} 天` : date;
  }

  function actionGroups(actions) {
    const days = new Map();
    const pending = new Map();
    for (const action of actions) {
      if (action.kind !== "itinerary") continue;
      const group = action.date ? days : pending;
      const label = action.date || action.dateLabel || "";
      if (!group.has(label)) group.set(label, []);
      group.get(label).push(action);
    }
    const byTime = (a, b) => (a.time || "99:99").localeCompare(b.time || "99:99");
    const groups = [...days.keys()].sort().map((date) => ({title: headingForDay(date), actions: days.get(date).sort(byTime)}));
    const pendingLabels = [...pending.keys()].filter(Boolean).sort((a, b) => a.localeCompare(b, "zh-CN", { numeric: true }));
    for (const label of pendingLabels) groups.push({title: `${label} · 日期待补充`, actions: pending.get(label).sort(byTime)});
    if (pending.has("")) groups.push({title: "日期待补充", actions: pending.get("").sort(byTime)});
    for (const [kind, title] of [["restaurant", "餐厅"], ["expense", "支出"]]) {
      const matching = actions.filter((action) => action.kind === kind);
      if (matching.length) groups.push({title, actions: matching});
    }
    return groups;
  }

  function recordedExpense(id) {
    return active.trip?.expenses?.find((expense) => expense.id === id);
  }

  function draftState(entry, action) {
    const index = entry.actions.indexOf(action);
    const automatic = entry.autoSaved?.find((record) => record.index === index);
    const expense = automatic && recordedExpense(automatic.id);
    return {expense, saved: Boolean(expense) || active.saved.has(action), removed: Boolean(automatic && !expense)};
  }

  function addDraft(parent, entry, action) {
    const card = document.createElement("div");
    card.className = "ai-draft";
    const [, kind] = descriptions[modeByKind[action.kind]];
    const {expense, saved, removed} = draftState(entry, action);
    const visible = expense ? {...action, ...expense} : action;
    addText(card, "hint", expense ? "已记下" : saved ? `已记入${kind}` : removed ? "已撤销或删除" : `${kind}草稿`);
    addText(card, "", visible.title || visible.name || "名称待核对", "strong");
    const details = summarize(visible);
    if (details) addText(card, "hint", details);
    const source = [action.imageIndex ? `图片 ${action.imageIndex}` : "", action.date && action.dateLabel && action.dateLabel !== action.date ? `日期依据 ${action.dateLabel}` : ""]
      .filter(Boolean).join(" · ");
    if (source) addText(card, "hint ai-draft-source", source);
    if (action.kind === "itinerary" && action.date && active.trip?.startDate && active.trip.endDate
      && (action.date < active.trip.startDate || action.date > active.trip.endDate)) {
      addText(card, "hint ai-draft-source", "日期超出这趟旅行的范围，请核对。");
    }
    if (!saved && !removed && action.kind === "expense" && action.date && action.amountCents
      && active.trip?.expenses?.some((record) => record.date === action.date && record.amountCents === action.amountCents)) {
      addText(card, "hint ai-draft-source", "这笔支出可能已经记过，请核对后再保存。");
    }
    if (!saved) {
      const review = addText(card, "button tonal", removed ? "重新核对" : "核对并记下", "button");
      review.type = "button";
      review.addEventListener("click", () => {
        const conversation = active;
        stopSpeech();
        conversation.review(action, () => {
          conversation.saved.add(action);
          persist(conversation);
          if (host && active === conversation) renderConversation({preserveScroll: true});
        });
      });
    } else if (expense && typeof active.editSavedExpense === "function") {
      const edit = addText(card, "button tonal", "修改", "button");
      edit.type = "button";
      const conversation = active;
      edit.addEventListener("click", () => {
        if (!host || active !== conversation || request || preparing) return;
        stopSpeech();
        conversation.editSavedExpense(conversation.trip.id, expense.id);
      });
    }
    parent.append(card);
  }

  function addAutomaticRecord(parent, entry) {
    if (!entry.autoSaved?.length) return;
    const count = entry.autoSaved.filter(({id}) => recordedExpense(id)).length;
    const removed = entry.autoSaved.length - count;
    const banner = addText(parent, "ai-auto-recorded", "", "div");
    const text = [count ? `已记下 ${count} 笔。` : "", removed ? `${removed} 笔已撤销或删除。` : ""].join("");
    addText(banner, "", text);
    if (!count || removed || typeof entry.undo !== "function") return;
    const undo = addText(banner, "button quiet", "撤销", "button");
    undo.type = "button";
    undo.dataset.aiUndo = "";
    undo.disabled = Boolean(request) || preparing;
    const conversation = active;
    undo.addEventListener("click", () => {
      if (!host || active !== conversation || !conversation.history.includes(entry) || request || preparing) return;
      let undone = false;
      try { undone = entry.undo(); } catch { /* Preserve the current ledger if undo cannot complete. */ }
      if (!undone) return status("ai-status", "暂时无法撤销。请在记账页核对这笔支出。");
      entry.undo = undefined;
      status("ai-status", "已撤销本次自动记下的支出。");
      renderConversation({preserveScroll: true});
    });
  }

  function renderImageResults(parent, entry) {
    if (!entry.imageResults?.length) return;
    const list = addText(parent, "ai-image-results", "", "ul");
    list.setAttribute("aria-label", "逐图识别结果");
    for (const result of entry.imageResults) {
      const row = addText(list, "ai-image-result", "", "li");
      row.dataset.state = result.status;
      row.dataset.resultImage = String(result.imageIndex);
      const linked = entry.actions.filter(({imageIndex}) => imageIndex === result.imageIndex);
      const states = linked.map((action) => draftState(entry, action));
      const saved = states.filter((state) => state.saved).length;
      const removed = states.filter((state) => state.removed && !state.saved).length;
      const pending = linked.length - saved - removed;
      const details = [saved ? `${saved} 项已记下` : "", pending ? `${pending} 项待核对` : "", removed ? `${removed} 项已撤销或删除` : ""].filter(Boolean);
      addText(row, "", [`图片 ${result.imageIndex} · ${imageLabels[result.status]}`, ...details].join(" · "), "strong");
      if (result.reason) addText(row, "hint", result.reason, "small");
    }
  }

  function displayMessage(entry) {
    const node = document.createElement("div");
    node.className = entry.user ? "ai-message ai-message-user" : "ai-message";
    if (entry.state) node.dataset.state = entry.state;
    if (entry.text) addText(node, "ai-message-text", entry.text);
    if (entry.images?.length) {
      const images = addText(node, "ai-message-images", "", "div");
      for (const [index, source] of entry.images.entries()) image(images, source, `已发送的图片 ${index + 1}`);
    }
    if (entry.user && entry.imageCount && !entry.images?.length) addText(node, "hint", `已发送 ${entry.imageCount} 张图片`);
    if (entry.highlights?.length) {
      const values = addText(node, "ai-answer-values", "", "dl");
      for (const {label, value, tone} of entry.highlights) {
        const row = addText(values, "ai-answer-value", "", "div");
        if (tone) row.dataset.tone = tone;
        const title = addText(row, "", label, "dt");
        if (categories.expenseNames.includes(label)) {
          row.dataset.tone = categories.tone(label);
          row.dataset.category = "";
          const icon = document.createElement("span");
          icon.className = "ai-answer-icon";
          icon.innerHTML = categories.mark(label);
          title.prepend(icon);
        }
        addText(row, "", value, "dd");
      }
    }
    if (entry.settingsAction) {
      const open = addText(node, "button tonal ai-message-link", "去设置", "button");
      open.type = "button";
      open.addEventListener("click", () => active?.openSettings?.());
    }
    addAutomaticRecord(node, entry);
    renderImageResults(node, entry);
    if (entry.actions?.length) {
      const list = document.createElement("div");
      list.className = "ai-drafts";
      for (const group of actionGroups(entry.actions)) {
        const section = document.createElement("section");
        section.className = "ai-draft-group";
        addText(section, "ai-draft-day", group.title, "h4");
        for (const action of group.actions) addDraft(section, entry, action);
        list.append(section);
      }
      node.append(list);
    }
    messages.append(node);
  }

  function nearLatest() {
    return messages.scrollHeight - messages.clientHeight - messages.scrollTop < 24;
  }

  function renderConversation({preserveScroll = false} = {}) {
    const scrollTop = messages.scrollTop;
    const followLatest = !preserveScroll || nearLatest();
    messages.replaceChildren();
    if (!active.history.length && !active.pending) {
      const empty = document.createElement("div");
      empty.className = "ai-empty";
      const artwork = document.createElement("img");
      artwork.className = "ai-empty-art";
      artwork.alt = "";
      artwork.decoding = "async";
      artwork.src = emptyArt;
      empty.append(artwork);
      addText(empty, "", active.trip ? "发来旅途截图，我来整理" : "先选一趟旅行", "h3");
      addText(empty, "", active.trip ? descriptions[active.mode][0] : "先新建或恢复一趟旅行，再把截图整理进对应的账本。");
      if (active.trip) {
        const examples = document.createElement("div");
        examples.className = "ai-examples";
        for (const example of ["明早 9 点去古城", "收藏这家米线店", "今天打车 36 元"]) {
          const button = addText(examples, "button tonal", example, "button");
          button.type = "button";
          button.addEventListener("click", () => {
            if (text.readOnly) return;
            text.value = active.text = example;
            text.focus({preventScroll: true});
            sync();
          });
        }
        empty.append(examples);
      }
      messages.append(empty);
    } else {
      for (const entry of active.history) displayMessage(entry);
      if (active.pending) {
        displayMessage(active.pending.user);
        displayMessage(active.pending.reply);
      }
    }
    messages.scrollTop = (active.history.length || active.pending) ? (followLatest ? messages.scrollHeight : scrollTop) : 0;
  }

  function renderAttachments() {
    attachments.replaceChildren();
    attachments.hidden = !active.images.length;
    active.images.forEach((source, index) => {
      const tile = document.createElement("div");
      tile.className = "ai-attachment";
      const segmentCount = source.frames.length > 1 ? `，已分成 ${source.frames.length} 段` : "";
      image(tile, source.preview, `待发送图片 ${index + 1}${segmentCount}`);
      if (source.frames.length > 1) addText(tile, "hint ai-image-segments", `${source.frames.length} 段`, "span");
      const remove = addText(tile, "button quiet", "×", "button");
      remove.type = "button";
      remove.setAttribute("aria-label", `移除图片 ${index + 1}`);
      remove.disabled = Boolean(request) || preparing;
      remove.addEventListener("click", () => {
        active.images.splice(index, 1);
        renderAttachments();
        sync();
      });
      attachments.append(tile);
    });
  }

  options.querySelector("summary").textContent = "识别、记账与语音";
  const voiceLabel = addText(options, "field ai-voice-setting", "", "label");
  addText(voiceLabel, "", "语音输入方式", "span");
  const voiceSelect = addText(voiceLabel, "", "", "select");
  voiceSelect.id = "ai-voice-method";
  voiceSelect.append(new Option("浏览器直接语音识别", "browser"), new Option("使用已配置接口转写（按需）", "provider"));
  voiceSelect.value = preferredVoice;
  addText(options, "hint", "聊天里的麦克风可直接转成文字。iPhone 上请允许 Safari 使用麦克风，并打开 Siri。");
  const modelLabel = addText(options, "field ai-voice-setting", "", "label");
  addText(modelLabel, "", "语音转写模型", "span");
  const voiceModel = addText(modelLabel, "", "", "input");
  voiceModel.type = "text";
  voiceModel.id = "ai-transcribe-model";
  voiceModel.maxLength = 150;
  voiceModel.autocomplete = "off";
  voiceModel.spellcheck = false;
  voiceModel.placeholder = "你的接口提供的转写模型 ID";
  voiceModel.value = transcriptionModel;
  const voicePrivacy = addText(options, "hint", "只使用你的当前接口。发送录音前会显示地址并请你确认，接口可能按量计费。转写结果可修改，录音只在本次操作中保留。");
  const syncVoiceSettings = () => {
    modelLabel.hidden = preferredVoice !== "provider";
    voicePrivacy.hidden = preferredVoice !== "provider";
  };
  syncVoiceSettings();
  voiceSelect.addEventListener("change", () => {
    preferredVoice = voiceSelect.value;
    remember(voiceKey, preferredVoice);
    syncVoiceSettings();
  });
  voiceModel.addEventListener("input", () => {
    transcriptionModel = voiceModel.value.trim();
    remember(transcriptionKey, transcriptionModel);
  });
  const payloadDetails = addText(options, "ai-payload-preview", "", "details");
  payloadDetails.id = "ai-payload-details";
  addText(payloadDetails, "", "查看本次发送内容", "summary");
  const payloadText = addText(payloadDetails, "field", "", "label");
  addText(payloadText, "", "本次文字", "span");
  const payloadContent = addText(payloadText, "", "", "textarea");
  payloadContent.readOnly = true;
  payloadContent.rows = 3;
  const payloadScope = addText(payloadDetails, "hint", "");

  function syncPayload() {
    if (!payloadDetails.open) return;
    payloadContent.value = text.value.trim();
    const photos = active?.images || [];
    const count = photos.length;
    const frameCount = photos.reduce((sum, {frames}) => sum + frames.length, 0);
    const pending = active ? recentDrafts(active, text.value.trim(), active.mode, connectionGeneration).length : 0;
    const imageNotice = frameCount > count
      ? `${count} 张原图会按顺序发送为 ${frameCount} 段。`
      : count ? `${count} 张图片按下方预览发送。` : "本次没有附图。";
    const parts = [imageNotice];
    if (pending) parts.push(`同时发送 ${pending} 项相关待核对草稿。`);
    payloadScope.textContent = parts.join("");
  }

  payloadDetails.addEventListener("toggle", syncPayload);

  function sync() {
    const busy = Boolean(request) || preparing;
    const voiceBusy = Boolean(recognition || recording);
    get("ai-send").disabled = busy || voiceBusy || (!text.value.trim() && !active?.images.length);
    get("ai-add-image").disabled = busy || voiceBusy || active?.images.length >= maxImages;
    get("ai-add-image").title = inputMode === "text" ? "在接口设置切换到文字和图片" : "";
    get("ai-speech").disabled = busy || Boolean(recording && recording.phase !== "recording");
    text.readOnly = busy;
    get("ai-cancel-send").hidden = !request;
    for (const button of attachments.querySelectorAll("button")) button.disabled = busy;
    for (const button of messages.querySelectorAll("[data-ai-undo]")) button.disabled = busy;
    syncPayload();
  }

  const voice = get("ai-speech");
  const composer = get("ai-composer");
  const voiceActions = addText(composer, "ai-voice-actions", "", "div");
  get("ai-dictation").after(voiceActions);
  const keyboardButton = document.createElement("button");
  keyboardButton.type = "button";
  keyboardButton.className = "button quiet ai-dictation-fallback";
  keyboardButton.textContent = "打开键盘听写";
  keyboardButton.hidden = true;
  voiceActions.append(keyboardButton);
  const transcribeButton = addText(voiceActions, "button tonal", "发送录音转写", "button");
  transcribeButton.type = "button";
  transcribeButton.id = "ai-transcribe-audio";
  transcribeButton.hidden = true;
  const discardButton = addText(voiceActions, "button quiet", "放弃录音", "button");
  discardButton.type = "button";
  discardButton.id = "ai-discard-audio";
  discardButton.hidden = true;
  voiceActions.hidden = true;

  function updateDictation(message = "", showFallback = false) {
    const followLatest = nearLatest();
    keyboardButton.hidden = !showFallback;
    transcribeButton.hidden = recording?.phase !== "ready";
    discardButton.hidden = !recording;
    voiceActions.hidden = keyboardButton.hidden && transcribeButton.hidden && discardButton.hidden;
    status("ai-dictation", message);
    if (followLatest) messages.scrollTop = messages.scrollHeight;
  }

  function stopSpeech() {
    const take = recognition;
    recognition = undefined;
    if (take) {
      clearTimeout(take.timer);
      try { take.engine.abort(); } catch { /* Recognition has already stopped. */ }
    }
    discardRecording();
    voice.setAttribute("aria-label", "语音输入");
    voice.setAttribute("aria-pressed", "false");
    updateDictation();
  }

  function keyboardDictation() {
    stopSpeech();
    // iPhone can open the software keyboard only while the tap is still active.
    text.focus({preventScroll: true});
    if (document.activeElement !== text) text.focus();
    updateDictation("点系统键盘上的麦克风听写，核对后发送。");
    sync();
  }

  function speechFallback(message) {
    updateDictation(message, true);
    sync();
  }

  function fillSpeech(result, message, showFallback = false) {
    const next = [text.value, result].filter(Boolean).join("\n");
    const max = text.maxLength;
    text.value = max > 0 ? next.slice(0, max) : next;
    active.text = text.value;
    updateDictation(max > 0 && next.length > max ? "输入已达长度上限，请核对已填入的文字。" : message, showFallback);
    sync();
  }

  function finishSpeech(take, message) {
    if (recognition !== take) return;
    stopSpeech();
    if (active !== take.conversation || !host) return;
    if (take.final) return fillSpeech(take.final, "听写已填入，可以修改后发送。");
    if (take.interim) return fillSpeech(take.interim, "识别尚未完成，已保留收到的文字，请核对。", true);
    speechFallback(message || "暂未收到语音文字，可再点麦克风重试。");
  }

  function speechUnavailable(message) {
    if (!appleMobile) return message;
    return navigator.standalone || matchMedia("(display-mode: standalone)").matches
      ? `${message} 可用 Safari 打开网页再试。`
      : `${message} 请检查 Siri 和 Safari 的麦克风权限。`;
  }

  function speechError(code) {
    const messages = {
      "not-allowed": "麦克风或语音识别权限未开启。",
      "service-not-allowed": "当前浏览器无法使用语音识别服务。",
      "audio-capture": "暂时无法使用麦克风。请检查权限或关闭正在占用麦克风的应用。",
      "language-not-supported": "当前语音服务不支持中文听写。",
      "no-speech": "未检测到清晰语音。可再点麦克风重试。",
      network: "语音识别连接失败，请检查网络后重试。",
      aborted: "语音识别已中断。可再点麦克风重试。"
    };
    const message = Object.hasOwn(messages, code) ? messages[code] : "浏览器未能完成本次语音识别。";
    return ["not-allowed", "service-not-allowed"].includes(code) ? speechUnavailable(message) : message;
  }

  keyboardButton.addEventListener("click", keyboardDictation);
  voice.addEventListener("click", () => {
    if (!active?.trip || request || preparing) return;
    if (preferredVoice === "provider") return void recordForProvider();
    if (recognition) {
      const take = recognition;
      clearTimeout(take.timer);
      updateDictation("正在完成听写…");
      take.timer = setTimeout(() => finishSpeech(take), 3000);
      try { take.engine.stop(); } catch { finishSpeech(take); }
      return;
    }
    const Speech = [globalThis.SpeechRecognition, globalThis.webkitSpeechRecognition].find((type) => typeof type === "function");
    if (!Speech) return speechFallback(speechUnavailable("当前页面无法直接语音识别。"));
    let take;
    try {
      const engine = new Speech();
      take = {engine, conversation: active, final: "", interim: "", started: false};
      recognition = take;
      engine.lang = "zh-CN";
      engine.continuous = false;
      engine.interimResults = true;
      const startHearing = () => {
        if (recognition !== take || take.started) return;
        take.started = true;
        clearTimeout(take.timer);
        take.timer = setTimeout(() => finishSpeech(take, speechUnavailable("语音服务没有返回文字。")), 20000);
        updateDictation("正在听写，再点一次结束。");
      };
      engine.onstart = startHearing;
      engine.onaudiostart = startHearing;
      engine.onresult = (event) => {
        if (recognition !== take) return;
        const results = Array.from(event.results || []);
        const read = (isFinal) => results.filter((result) => Boolean(result.isFinal) === isFinal)
          .map((result) => result[0]?.transcript || "").join("").trim();
        take.final = read(true);
        take.interim = read(false) || take.interim;
        if (take.final) finishSpeech(take);
      };
      engine.onerror = ({error}) => finishSpeech(take, speechError(error));
      engine.onend = () => finishSpeech(take);
      voice.setAttribute("aria-label", "停止听写");
      voice.setAttribute("aria-pressed", "true");
      updateDictation("正在启动听写…");
      take.timer = setTimeout(() => finishSpeech(take, speechUnavailable("浏览器未能启动语音识别。")), 15000);
      sync();
      engine.start();
    } catch {
      const message = speechUnavailable("浏览器未能启动语音识别。");
      if (take) finishSpeech(take, message);
      else speechFallback(message);
    }
  });

  const maxRecordingBytes = 5 * 1024 * 1024;

  function releaseMicrophone(take) {
    for (const track of take.stream?.getTracks() || []) track.stop();
    take.stream = undefined;
  }

  function discardRecording() {
    const take = recording;
    recording = undefined;
    if (!take) return;
    clearTimeout(take.timer);
    take.controller?.abort();

      return `<span class="spending-ring-slice" data-tone="${tone(label)}"
        style="--spending-slice-start:${start}turn;--spending-slice-end:${end}turn"></span>`;
    }).join("");
    const topAmount = categories[0]?.[1];
    const tied = topAmount === categories[1]?.[1];
    const highest = categories[0]?.[0];
    const rows = categories.map(([label, cents]) => `<li data-tone="${tone(label)}">
      <span class="spending-category-label"><span class="category-icon" aria-hidden="true">${mark(label)}</span>${escapeHtml(label)}</span>
      <strong class="spending-number">${escapeHtml(money(cents))}</strong>
      <span class="spending-percent">${shareLabel(cents, total)}</span>

    return `<section class="spending-panel" aria-labelledby="spending-categories">
      <h2 id="spending-categories">分类支出</h2>

        <figcaption class="spending-ring-caption">
          <span>总花费</span>
          <strong class="spending-number">${escapeHtml(money(total))}</strong>
          ${highest ? `<span>${tied ? "并列最多" : "花费最多"} · ${escapeHtml(highest)}</span>` : ""}
        </figcaption>
      </figure>
      ${rows ? `<ul class="spending-category-list">${rows}</ul>` : ""}
    </section>`;
  }

    const peak = days.reduce((highest, [, cents]) => Math.max(highest, cents), 0);
    const dailyTotal = days.reduce((sum, [, cents]) => sum + cents, 0);
    const average = days.length ? Math.round(dailyTotal / days.length) : 0;
    const spansYears = new Set(days.map(([date]) => date.slice(0, 4))).size > 1;

    catch { return {message: "当前账本金额超出可汇总范围，可以到「记账」核对明细。"}; }
    const subject = filter.length ? `${scope}的${filter.join("、")}` : scope;
    if (!summary.totalCents) return {message: `${subject}还没有支出记录。`};
    if (/分[摊担]|垫付|结算|AA/i.test(question)) {
      const split = /分[摊担]|共同|AA/i.test(question);
      const paid = /垫付/.test(question) && !split;
      const amountsOnly = /共同.*多少|共同.*总额|分摊人数/.test(question);
      const highlights = amountsOnly
        ? [{label: "共同分担总数", value: money(summary.sharedCents)}, {label: "分摊人数", value: `${summary.sharedShares.size} 人`}]
        : summary.balances.map(({name, paidCents, shareCents, netCents}) => ({
          label: name,
          value: paid ? money(paidCents) : /结算|还要|还需/.test(question) ? balanceLabel(netCents) : money(shareCents)
        }));
      return {message: `${subject}的${paid ? "垫付" : /结算|还要|还需/.test(question) ? "结算" : "分摊"}如下。`, highlights};
    }
    const highlights = [...summary.categoryTotals].sort((a, b) => b[1] - a[1])
      .map(([label, cents]) => ({label, value: money(cents)}));
    return {message: `${subject}实际支出 ${money(summary.totalCents)}。`, highlights};
  }

  function expensesMarkup(expenses, names, hasEntries) {
    const items = expenses.slice().reverse().sort((a, b) => b.date.localeCompare(a.date));
    if (!items.length) {
      return `<div class="empty">
        <span class="empty-mark" aria-hidden="true">≡</span>
        <h3>${hasEntries ? "这个筛选下没有支出" : "还没有支出"}</h3>
        <button type="button" class="button tonal" data-action="${hasEntries ? "reset-filters" : "new-expense"}">${hasEntries ? "清除筛选" : "记第一笔"}</button>
      </div>`;
    }

    const days = new Map();
    for (const item of items) {
      if (!days.has(item.date)) days.set(item.date, []);
      days.get(item.date).push(item);
    }
    return [...days].map(([date, dayItems]) => `<section class="day-group">
      <header class="day-heading"><h3>${readableDate(date)}</h3><span>${money(dayItems.reduce((sum, item) => sum + item.amountCents, 0))}</span></header>
      <ul class="expense-list">${dayItems.map((expense) => {
        const category = categories.includes(expense.category) ? expense.category : "其他";
        const note = [category, expense.place, `${names[expense.payerId] || "成员"}垫付`,
          expense.participantIds.length > 1 ? `${expense.participantIds.length} 人分摊`
            : (expense.participantIds[0] === expense.payerId ? "个人花销" : "1 人承担")].filter(Boolean);
        return `<li><button type="button" class="expense-row" data-action="edit-expense" data-id="${escapeHtml(expense.id)}" data-tone="${categoryTone(category)}">
          <span class="category-icon" aria-hidden="true">${categoryMark(category)}</span>
          <span class="expense-copy"><strong>${escapeHtml(expense.title)}</strong><small>${note.map(escapeHtml).join(" · ")}</small></span>
          <span class="expense-amount">${money(expense.amountCents)}</span>
        </button></li>`;
      }).join("")}</ul>
    </section>`).join("");
  }

  function balanceLabel(cents) {
    if (cents > 0) return `应收 ${money(cents)}`;
    if (cents < 0) return `应付 ${money(-cents)}`;
    return "已平衡";
  }

  function readLink(value) {
    if (!value) return "";
    try {
      const url = new URL(value);
      return ["http:", "https:"].includes(url.protocol) ? url.href : "";
    } catch {
      return "";
    }
  }

  function coverMarkup(value) {
    const photo = cover.photoUrl(value);
    if (photo) return `<img class="trip-cover-image trip-cover-photo" alt="" aria-hidden="true" src="${photo}">`;
    return coverSource.startsWith("data:image/webp;base64,") || /^assets\/trip-cover\.[0-9a-f]{12}\.webp$/.test(coverSource)
      ? `<img class="trip-cover-image" alt="" aria-hidden="true" loading="lazy" decoding="async" fetchpriority="low" src="${coverSource}">`
      : "";
  }

  function navigationMarkup() {
    const currentTab = activeView === "spending" ? "ledger" : activeView;
    return `<nav class="travel-nav" aria-label="主导航">
      ${navItems.map(([id, label, icon]) => `<button type="button" data-view="${id}"
        ${id === currentTab ? 'aria-current="page"' : ''}>
        <svg class="travel-nav-icon" aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor"
          stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${icon}</svg>
        <span>${label}</span>
      </button>`).join("")}
    </nav>`;
  }

  function render() {
    const trip = getTrip() || state.trips[0];
    $("switch-button").hidden = state.trips.length < 2;
    const content = $("content");
    globalThis.TravelAI.unmountSettings();
    if (activeView === "ai") {
      document.body.dataset.view = "ai";
      if (!$("ai-view")) content.innerHTML = `<div id="ai-view" class="ai-view"></div>${navigationMarkup()}`;
      globalThis.TravelAI.mount($("ai-view"), {
        trip, today, commitAutoExpenses, editSavedExpense,
        openSettings() { setView("settings"); globalThis.TravelAI.showSettings(); },
        localAnswer: (text) => answerLedgerQuestion(trip, text),
        review: (action, onSaved) => trip && reviewAIAction(trip.id, action, onSaved)
      });
      return;
    }
    globalThis.TravelAI.unmount();
    if (activeView === "settings") {
      document.body.dataset.view = "settings";
      content.innerHTML = globalThis.TravelSettings.render(trip) + navigationMarkup();
      globalThis.TravelAI.mountSettings($("settings-ai-host"));
      globalThis.TravelSettings.hydrate(content);
      return;
    }
    document.body.dataset.view = trip ? activeView : "empty";
    if (!trip) {
      $("content").innerHTML = `<section class="hero travel-hero hero-empty" data-view="empty">
        ${coverMarkup()}
        <div class="hero-inner">
          <div class="hero-copy">
            <h1>${APP_NAME}</h1>
            <p class="hero-meta">排行程、存餐厅，回程算 AA。</p>
          </div>
          <div class="hero-actions">
            <button type="button" class="button primary" data-action="new-trip">＋ 新建旅行</button>
          </div>
        </div>
      </section>
      <section class="starter">
        <div><h2>试一趟云南游</h2><p>看看餐厅怎样排进行程，餐费怎样记进账本。</p></div>
        <button type="button" class="button tonal" data-action="demo">打开示例账本</button>
      </section>${navigationMarkup()}`;
      return;
    }

    if (activeView === "spending") {
      let statistics;
      try {
        statistics = globalThis.TravelSpendingStats.render(trip, summarize(trip), {escapeHtml, money, readableDate});
      } catch {
        statistics = `<p class="storage-error" role="alert">暂时无法统计这本账的支出。</p>
          <button type="button" class="button tonal" data-view="ledger">返回记账</button>`;
      }
      content.innerHTML = statistics + navigationMarkup();
      return;
    }

    const places = [...new Set(trip.expenses.map((item) => item.place).filter(Boolean))];
    const heroPlaces = [...new Set([
      ...places,
      ...(trip.itinerary || []).map((item) => item.place),
      ...(trip.restaurants || []).map((item) => item.city)
    ].filter(Boolean))];
    const route = readLink(trip.link);
    const heroCopy = `<div class="hero-copy">
      ${trip.isDemo ? '<p class="hero-kicker">示例旅行</p>' : ""}
      <h1>${escapeHtml(trip.name)}</h1>
      <p class="hero-meta">${trip.members.length} 人同行${heroPlaces.length ? ` <span aria-hidden="true">·</span> ${heroPlaces.length} 个地点` : ""}</p>
    </div>`;
    if (activeView === "ledger") {
      content.innerHTML = ledgerMarkup(trip, heroCopy) + navigationMarkup();
      return;
    }
    const dateRange = formatTripDates(trip);
    const hero = `<section class="hero travel-hero" data-view="${activeView}">
      ${coverMarkup(trip.coverPhoto)}
      <div class="hero-inner">
        ${heroCopy}
        <div class="hero-context">
          <button type="button" class="button tonal hero-settings-button" data-action="edit-trip">旅行设置</button>
        </div>
      </div>
      ${dateRange ? `<span class="trip-date-range">${dateRange}</span>` : ""}
    </section>`;
    const page = {
      itinerary: () => globalThis.TravelItinerary.render(trip, viewContext)
        + (route ? `<div class="existing-plan-link"><a class="button tonal" href="${escapeHtml(route)}" target="_blank" rel="noopener noreferrer">打开外部行程</a></div>` : ""),
      restaurants: () => globalThis.TravelRestaurants.render(trip, viewContext)
    };
    content.innerHTML = hero + page[activeView]() + navigationMarkup();
  }

  function ledgerMarkup(trip, heroCopy) {
    let summary;
    try {
      summary = summarize(trip);
    } catch {
      return '<p class="storage-error" role="alert">这本账的记录无法读取。请切换到其他账本。</p>';
    }
    const names = Object.fromEntries(trip.members.map(({id, name}) => [id, name]));
    const usedCategories = categories.filter((name) => trip.expenses.some((item) => item.category === name));
    if (!usedCategories.includes(categoriesFilter)) categoriesFilter = "";
    const visibleExpenses = categoriesFilter
      ? trip.expenses.filter(({category}) => category === categoriesFilter) : trip.expenses;
    return `<section class="hero travel-hero" data-view="ledger">
      <div class="hero-inner">
        ${heroCopy}
        <div class="hero-context">
          <div class="hero-actions ledger-hero-actions">
            <button type="button" class="button primary" data-action="new-expense">＋ 记一笔</button>
          </div>
        </div>
      </div>
      ${overviewMarkup(summary)}
      <div class="ledger-hero-footer">
        <p class="hint">单人金额按参与多人分摊的成员平均</p>
        <div class="ledger-detail-actions">
          <button type="button" class="button tonal" data-action="settle">查看结算</button>
          <button type="button" class="button quiet" data-view="spending">消费统计</button>

      </div>

          <div class="ledger-title-group"><h2 id="ledger-title">支出明细</h2><span class="count">${visibleExpenses.length} 笔</span></div>

        </header>
        ${expensesMarkup(visibleExpenses, names, Boolean(trip.expenses.length))}
      </section>

  function participantsMarkup(members, sharedShares) {
    const participants = members.filter(({id}) => sharedShares.has(id));
    return `<section class="ledger-participants" aria-labelledby="members-title">
      <h2 id="members-title">参与分摊</h2>
      ${participants.length ? `<ul class="ledger-participant-list">${participants.map(({name}, index) => `<li class="ledger-participant">
        <span class="ledger-avatar" data-tone="${participantTones[index % participantTones.length]}" aria-hidden="true">${escapeHtml([...name][0] || "")}</span>
        <span>${escapeHtml(name)}</span>
      </li>`).join("")}</ul>` : '<p class="hint">暂无参与多人分摊的成员</p>'}
    </section>`;
  }

  function openTripForm(trip) {
    tripFormId = trip?.id || null;
    tripFormDates = { startDate: trip?.startDate || "", endDate: trip?.endDate || "" };
    $("trip-form").reset();
    coverEditor.reset(trip?.coverPhoto);
    $("trip-heading").textContent = trip ? "旅行设置" : "新建旅行";
    $("trip-submit").textContent = trip ? "保存设置" : "创建旅行";
    $("trip-member-label").textContent = trip ? "新增同行人" : "同行人";
    $("trip-name").value = trip?.name || "";
    $("trip-start-date").value = tripFormDates.startDate;
    $("trip-end-date").value = tripFormDates.endDate;
    $("trip-link").value = trip?.link || "";
    $("trip-existing-members").innerHTML = trip
      ? `<div class="form-grid existing-members">${trip.members.map(({id, name}, index) => `<label class="field">
         同行人 ${index + 1}<input name="existing-member" data-id="${escapeHtml(id)}" value="${escapeHtml(name)}" maxlength="20" required></label>`).join("")}</div>`
      : "";
    setMessage($("trip-error"));
    tripSheet.dataset.dirty = "";
    tripSheet.showModal();
    if (!trip) $("trip-name").focus();
  }

  function saveTrip(event) {
    event.preventDefault();
    const error = $("trip-error");
    const coverChange = coverEditor.value();
    if (coverChange.pending) return setMessage(error, "封面照片正在准备，请稍后再保存。");
    const name = $("trip-name").value.trim();
    const startDate = $("trip-start-date").value;
    const endDate = $("trip-end-date").value;
    const rawLink = $("trip-link").value.trim();
    const link = readLink(rawLink);
    const existingMembers = [...$("trip-existing-members").querySelectorAll("input")].map((input) => ({
      id: input.dataset.id, name: input.value.trim()
    }));
    const added = $("trip-members").value.split(/[,，、;；\n]+/)
      .map((name) => name.trim()).filter(Boolean).map((name) => ({ id: uid(), name }));
    const members = [...existingMembers, ...added];
    if (!name) return setMessage(error, "请填写旅行名称。");
    if (Boolean(startDate) !== Boolean(endDate)) return setMessage(error, "请同时填写出发日期和到达日期，也可以都留空。");
    if (startDate && !tripDates({ startDate, endDate })) return setMessage(error, "请检查日期，到达日期须为出发当天或之后。");
    if (!members.length || members.some((member) => !member.name)) return setMessage(error, "请填写至少一位同行人的昵称。");
    if (members.some((member) => [...member.name].length > 20)) return setMessage(error, "每个昵称最多 20 个字。");
    if (new Set(members.map((member) => member.name)).size !== members.length) return setMessage(error, "有重复昵称，请给每位同行人一个不同的昵称。");
    if (rawLink && !link) return setMessage(error, "行程链接请用 http:// 或 https:// 开头。");

    const id = tripFormId || uid();
    const details = { name, members, link, startDate, endDate };
    const success = save((current) => {
      if (tripFormId) {
        const trip = getCurrentTrip(current, id);
        if (trip.members.length !== existingMembers.length
          || trip.members.some((member, index) => member.id !== existingMembers[index].id)) {
          throw new LedgerChangeError("同行人已在另一个窗口更新。请关闭后重新打开编辑。");
        }
        if ((trip.startDate || "") !== tripFormDates.startDate || (trip.endDate || "") !== tripFormDates.endDate) {
          throw new LedgerChangeError("旅行日期已在另一个窗口更新。请关闭后重新打开编辑。");
        }
        if (coverChange.changed && cover.photoUrl(trip.coverPhoto) !== coverChange.original) {
          throw new LedgerChangeError("封面已在另一个窗口更新。请关闭后重新打开编辑。");
        }
        Object.assign(trip, details);
        if (coverChange.changed) {
          if (coverChange.photo) trip.coverPhoto = coverChange.photo;
          else delete trip.coverPhoto;
        }
      } else {
        const trip = { id, ...details, expenses: [] };
        if (coverChange.photo) trip.coverPhoto = coverChange.photo;
        current.trips.unshift(trip);
      }
      current.activeId = id;
    }, error);
    if (success) {
      tripSheet.close();
      if (!tripFormId) setView("itinerary");
      notify(tripFormId ? "旅行设置已保存" : "旅行已创建");
    }
  }

  function openExpenseForm(trip, expense, draft = {}, {fromAI = false, onSaved} = {}) {
    expenseFormTripId = trip.id;
    expenseFormId = expense?.id || null;
    expenseFromAI = fromAI;
    expenseOnSaved = onSaved;
    const values = expense || draft;
    expenseLinks = {};
    if (values.itineraryId) expenseLinks.itineraryId = values.itineraryId;
    if (values.restaurantId) expenseLinks.restaurantId = values.restaurantId;
    $("expense-form").reset();
    $("expense-heading").textContent = expense ? "编辑支出" : fromAI ? "核对记账草稿" : "记一笔";
    $("expense-delete").hidden = !expense;
    $("quick-entry").hidden = Boolean(expense || fromAI || values.itineraryId || values.restaurantId);
    $("expense-details").open = fromAI;
    $("expense-amount").value = values.amountCents ? (values.amountCents / 100).toFixed(2) : "";
    $("expense-title").value = values.title || "";
    $("expense-date").value = values.date || (fromAI ? "" : today());
    $("expense-category").value = values.category || "其他";
    $("expense-place").value = values.place || "";
    refreshExpenseContext();
    const payer = expense?.payerId || (trip.members.length === 1 ? trip.members[0].id : "");
    const selected = new Set(expense?.participantIds || trip.members.map((member) => member.id));
    $("payer-pills").innerHTML = trip.members.map(({id, name}) => `<label class="pill">
      <input type="radio" name="payer" value="${escapeHtml(id)}" ${id === payer ? "checked" : ""}>
      <span>${escapeHtml(name)}</span></label>`).join("");
    $("split-pills").innerHTML = trip.members.map(({id, name}) => `<label class="pill">
      <input type="checkbox" name="participant" value="${escapeHtml(id)}" ${selected.has(id) ? "checked" : ""}>
      <span>${escapeHtml(name)}</span></label>`).join("");
    setMessage($("quick-feedback"));
    setMessage($("expense-error"));
    updateSplitPreview();
    expenseSheet.dataset.dirty = "";
    expenseSheet.showModal();
    if (!matchMedia("(max-width: 700px)").matches) $("expense-amount").focus();
    return true;
  }

  function getPayer() {
    return $("payer-pills").querySelector(":checked")?.value || "";
  }

  function getSelected() {
    return [...$("split-pills").querySelectorAll(":checked")].map((input) => input.value);
  }

  function updateSplitPreview() {
    const amount = parseAmount($("expense-amount").value);
    const selected = getSelected();
    const payerId = getPayer();
    const preview = $("split-preview");
    if (!selected.length) {
      preview.textContent = "请选择至少一位分摊人。";
    } else if (!amount) {
      preview.textContent = `已选 ${selected.length} 人`;
    } else if (selected.length === 1 && selected[0] === payerId) {
      preview.textContent = "本笔计为个人花销";
    } else {
      const portions = Object.values(splitEven(amount, selected));
      const min = Math.min(...portions);
      const max = Math.max(...portions);
      preview.textContent = min === max
        ? `${selected.length} 人，每人 ${money(min)}`
        : `${selected.length} 人，每人 ${money(min)}–${money(max)}`;
    }
  }

  function applyQuick() {
    const result = parseQuickEntry($("quick-text").value);
    if (!result) {
      setMessage($("quick-feedback"), "请写一个项目和一笔金额，例如「打车 120」。");
      return;
    }
    $("expense-title").value = result.title.slice(0, 70);
    $("expense-amount").value = (result.amountCents / 100).toFixed(2);
    setMessage($("quick-feedback"), "已填入项目和金额，请确认垫付人和分摊人。");
    expenseSheet.dataset.dirty = "1";
    updateSplitPreview();
    const payer = $("payer-pills").querySelector("input");
    if (payer) payer.focus();
  }

  function updateSelected(mode) {
    const payer = getPayer();
    if (mode === "payer" && !payer) {
      setMessage($("expense-error"), "请先选择垫付人。");
      $("payer-pills").querySelector("input")?.focus();
      return;
    }
    for (const input of $("split-pills").querySelectorAll("input")) {
      input.checked = mode === "all" || input.value === payer;
    }
    expenseSheet.dataset.dirty = "1";
    setMessage($("expense-error"));
    updateSplitPreview();
  }

  function saveExpense(event) {
    event.preventDefault();
    const error = $("expense-error");
    const title = $("expense-title").value.trim();
    const amountCents = parseAmount($("expense-amount").value);
    const payerId = getPayer();
    const participantIds = getSelected();
    const date = $("expense-date").value;
    const category = $("expense-category").value;
    const place = $("expense-place").value.trim();
    if (!amountCents) {
      $("expense-amount").focus();
      return setMessage(error, "请输入大于 0 元的金额，最多保留两位小数。");
    }
    if (!title) return setMessage(error, "请填写这笔钱的用途。");
    if (title.length > 70 || place.length > 24) return setMessage(error, "项目最多 70 个字，地点最多 24 个字。");
    if (!payerId) return setMessage(error, "请选择是谁垫付的。");
    if (!participantIds.length) return setMessage(error, "请选择至少一位分摊人。");
    if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) return setMessage(error, "请选择一个有效的日期。");

    const expense = { id: expenseFormId || uid(), title, amountCents, payerId, participantIds, date, category, place, ...expenseLinks };
    const hasDuplicate = (trip) => trip.expenses.some((entry) => entry.title === title && entry.date === date
      && entry.amountCents === amountCents);
    let confirmedDuplicate = false;
    if (expenseFromAI) {
      try {
        if (hasDuplicate(getAITrip(readState(), expenseFormTripId))) {
          confirmedDuplicate = confirm("已有一笔同日、同名、同金额的支出。确认再记一笔吗？");
          if (!confirmedDuplicate) return setMessage(error, "请核对账本中的同一笔支出。");
        }
      } catch (failure) {
        return setMessage(error, failure instanceof LedgerChangeError ? failure.message : "暂时读不到这趟旅行。");
      }
    }
    const success = save((current) => {
      const trip = expenseFromAI ? getAITrip(current, expenseFormTripId) : getCurrentTrip(current, expenseFormTripId);
      if (expenseFromAI && !confirmedDuplicate && hasDuplicate(trip)) {
        throw new LedgerChangeError("刚出现一笔同日、同名、同金额的支出。请核对后再次保存。");
      }
      const memberIds = new Set(trip.members.map((member) => member.id));
      if (![payerId, ...participantIds].every((id) => memberIds.has(id))) {
        throw new LedgerChangeError("同行人名单已更新，请重新打开记账窗口。");
      }
      if (expenseFormId) {
        const index = trip.expenses.findIndex((item) => item.id === expenseFormId);
        if (index < 0) throw new LedgerChangeError("这笔支出已删除，请重新记一笔。");
        trip.expenses[index] = expense;
      } else {
        trip.expenses.push(expense);
      }
    }, error);
    if (success) {
      expenseSheet.close();
      expenseOnSaved?.();
      notify(expenseFormId ? "支出已更新" : "已记下一笔");
    }
  }

  function deleteExpense() {
    if (!expenseFormId || !confirm("删除这笔支出？AA 结算会随之更新。")) return;
    const success = save((current) => {
      const trip = getCurrentTrip(current, expenseFormTripId);

  async function copySettlement(trip, includeDetails = false) {
    const {transfers, totalCents} = summarize(trip);
    const names = Object.fromEntries(trip.members.map(({id, name}) => [id, name]));
    const lines = transfers.map(({fromId, toId, amountCents}) =>
      `${names[fromId]} 转给 ${names[toId]} ${money(amountCents)}`);
    const details = includeDetails ? ["", "支出明细", ...[...trip.expenses]
      .sort((a, b) => a.date.localeCompare(b.date))
      .map(({date, title, amountCents, payerId}) => `${date} ${title} ${money(amountCents)}（${names[payerId]}垫付）`)] : [];
    const text = [`${trip.name} · AA 结算`, `总支出 ${money(totalCents)} · ${trip.expenses.length} 笔`,
      ...(lines.length ? lines : ["大家的垫付和分摊已平衡。"]), ...details].join("\n");
    const copied = includeDetails ? "账单已复制，可以到微信粘贴。" : "结算已复制";
    try {
      await navigator.clipboard.writeText(text);
      notify(copied);
      return;
    } catch {
      if (!settlementSheet.open) openSettlement(trip);
      $("copy-fallback").hidden = false;
      const field = $("copy-text");
      field.value = text;
      field.focus();
      field.select();
      field.setSelectionRange(0, text.length);
      try {
        if (document.execCommand?.("copy")) notify(copied);

    }

      if (!confirm(`从文件恢复 ${incoming.trips.length} 本旅行账本？本机已有的同一账本会跳过。`)) return;
      let added = 0;
      let skipped = 0;
      const success = save((current) => {
        const existing = new Set(current.trips.map(({id}) => id));
        const trips = incoming.trips.filter(({id}) => !existing.has(id));
        added = trips.length;
        skipped = incoming.trips.length - added;
        current.trips.push(...trips);
        if (!existing.has(current.activeId)) current.activeId = current.trips.find(({id}) => id === incoming.activeId)?.id ?? current.trips[0]?.id ?? null;
      });
      if (success) notify(skipped ? `已恢复 ${added} 本，跳过 ${skipped} 本已有账本。` : `已恢复 ${added} 本旅行账本。`);

        const {kind, autoSaveEligible, paymentState, currency, date, amountCents} = action;
        const title = aiText(action.title);
        if (kind !== "expense" || !autoSaveEligible || !["completed", "stated"].includes(paymentState)
          || currency !== "CNY" || !Number.isFinite(calendarDay(date)) || date > todayValue
          || !title || title.length > 70 || !Number.isSafeInteger(amountCents)
          || parseAmount((amountCents / 100).toFixed(2)) !== amountCents) continue;
        if (trip.expenses.some((entry) => entry.date === date && entry.amountCents === amountCents)) continue;
        const category = categories.includes(action.category) ? action.category : "其他";
        const record = {id: uid(), title, amountCents, payerId, participantIds: [payerId], date,

  document.addEventListener("visibilitychange", autoCheck);
  syncControls();

})();
